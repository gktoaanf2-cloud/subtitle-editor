<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCH CINEMA EDITOR</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <style>
        @font-face {
            font-family: 'JoseonGulim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-base: #0a0a0a;
            --bg-panel: #161616;
            --border-color: #2a2a2a;
            --accent: #f47b20; 
            --netflix: #E50914;
            --text-main: #f0f0f0;
            --text-muted: #777777;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: "Pretendard Variable", Pretendard, sans-serif;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 좌측 슬로건 흐름 애니메이션 (보스 지시사항) */
        .marquee-container {
            position: fixed;
            left: 20px;
            top: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            pointer-events: none;
            z-index: 100;
        }

        .marquee-text {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
            opacity: 0.3;
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: scrollVertical 25s linear infinite;
            white-space: nowrap;
        }

        @keyframes scrollVertical {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 20px;
            color: #fff;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            transition: border-color 0.2s;
            z-index: 10;
        }

        .global-settings-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 12px 25px;
            border-radius: 8px;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .global-settings-panel input[type="color"] {
            width: 45px;
            height: 28px;
            border: 1px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            padding: 0;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 50px;
            width: 100%;
            max-width: 1400px;
            z-index: 10;
        }

        .scene-card {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 0;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        @media (max-width: 1100px) { .scene-card { grid-template-columns: 1fr; } }

        .canvas-container {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: grab;
            overflow: hidden;
        }

        .canvas-container:active { cursor: grabbing; }
        canvas { width: 100%; height: auto; display: block; }

        .panel {
            padding: 30px;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-height: 700px;
            overflow-y: auto;
        }
        
        .panel::-webkit-scrollbar { width: 6px; }
        .panel::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .control-group { display: flex; flex-direction: column; gap: 10px; }

        .label-row {
            display: flex; justify-content: space-between; font-size: 0.75rem;
            color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        }

        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        input[type="file"], input[type="text"], select, textarea {
            width: 100%; padding: 12px; background: var(--bg-base); border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 6px; font-family: inherit; box-sizing: border-box;
        }
        textarea { height: 80px; resize: none; }
        input[type="file"]::file-selector-button {
            background: #333; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 10px;
        }

        .checkbox-group { display: flex; gap: 15px; font-size: 0.85rem; flex-wrap: wrap; }
        .checkbox-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

        /* 동기화 패널 강조 */
        .sync-box {
            background: rgba(244, 123, 32, 0.1);
            border: 1px solid rgba(244, 123, 32, 0.3);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        .sync-box label { color: var(--accent); font-weight: bold; }

        /* 잠금 상태 표시 */
        .locked-ui { opacity: 0.4; pointer-events: none; }

        .btn-group { display: flex; justify-content: center; gap: 20px; margin-top: 50px; z-index: 10; }
        .btn {
            background: #fff; color: #000; border: none; padding: 15px 40px; font-size: 1rem;
            font-weight: 800; border-radius: 4px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
        }
        .btn:hover { background: #e0e0e0; }
        .btn-add { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); }
        .btn-add:hover { background: rgba(255,255,255,0.1); }
        .btn-export { background: var(--accent); color: #fff; border: none; }
        .btn-export:hover { background: #e66a15; }

        .btn-remove {
            position: absolute; top: 15px; right: 15px; background: rgba(255,0,0,0.2);
            color: #ff4444; border: 1px solid #ff4444; padding: 5px 10px; border-radius: 4px;
            cursor: pointer; font-size: 0.75rem; font-weight: bold; z-index: 10;
        }
        .btn-remove:hover { background: #ff4444; color: #fff; }
        .info-msg { position: absolute; top: 15px; left: 15px; font-size: 0.75rem; color: rgba(255,255,255,0.5); pointer-events: none; z-index: 10; }
    </style>
</head>
<body>

    <div class="marquee-container">
        <div class="marquee-text">아크 프리마들께서도 영화를 보신다 &nbsp;&nbsp;&nbsp;&nbsp; 아크 프리마들께서도 영화를 보신다</div>
    </div>

    <div class="header-title">ARCH CINEMA EDITOR</div>
    
    <div class="global-settings-panel">
        <span>🎨 GLOBAL POINT COLOR :</span>
        <input type="color" id="globalAccent" value="#f47b20">
    </div>
    
    <div id="workspace" class="workspace"></div>

    <div class="btn-group">
        <button class="btn btn-add" id="addScene">＋ 추가 컷 생성</button>
        <button class="btn btn-export" id="exportAll">💾 고화질 렌더링 다운로드</button>
    </div>

    <script>
        const workspace = document.getElementById('workspace');
        let sceneCounter = 0;
        const scenes = {};
        let globalAccentColor = "#f47b20"; 

        // [엔진] 필름 그레인(노이즈) 패턴 사전 생성 (성능 최적화)
        const noiseCanvas = document.createElement('canvas');
        noiseCanvas.width = 300; 
        noiseCanvas.height = 300;
        const nctx = noiseCanvas.getContext('2d');
        const imgData = nctx.createImageData(300, 300);
        // 오퍼시티 5~10% 수준의 미세 노이즈 입자 (알파값 15~20)
        for(let i=0; i<imgData.data.length; i+=4) {
            const v = Math.random() * 255;
            imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v;
            imgData.data[i+3] = 18; 
        }
        nctx.putImageData(imgData, 0, 0);

        // 초기 생성
        createScene();

        document.getElementById('addScene').addEventListener('click', createScene);
        document.getElementById('exportAll').addEventListener('click', exportImages);
        
        document.getElementById('globalAccent').addEventListener('input', (e) => {
            globalAccentColor = e.target.value;
            document.documentElement.style.setProperty('--accent', globalAccentColor);
            redrawAll();
        });

        // 글로벌 동기화를 위한 전체 리렌더링 함수
        function redrawAll() {
            Object.keys(scenes).forEach(id => draw(id));
        }

        function createScene() {
            const id = sceneCounter++;
            scenes[id] = {
                img: null,
                imgX: 0, imgY: 0, scale: 1, rotate: 0,
                
                // 동기화 플래그 (첫 번째 컷은 무조건 false, 나머지는 기본 true)
                syncMaster: id === 0 ? false : true,

                movieTitle: "", 
                text: id === 0 ? "자막을 입력하십시오." : "", 
                textY: 0, 
                
                fontFamily: 'pretendard', 
                fontSize: 60,
                textColor: "#ffffff",
                isBold: false, isItalic: false, isOutline: true,
                
                logoStyle: 'none', // none, ocn, netflix
                filmGrain: false,
                isDraggingImg: false
            };

            const card = document.createElement('div');
            card.className = 'scene-card';
            card.id = `card-${id}`;
            
            const removeBtnHtml = id > 0 ? `<button class="btn-remove" onclick="deleteScene(${id})">삭제</button>` : '';

            // 동기화 토글 UI (1번 컷 이후에만 생성)
            const syncUI = id > 0 ? `
                <div class="sync-box checkbox-group">
                    <label><input type="checkbox" id="sync-${id}" checked> <b>🔗 1번 컷 스타일/제목/색상 동기화</b></label>
                </div>
            ` : '';

            card.innerHTML = `
                ${removeBtnHtml}
                <div class="canvas-container" id="wrap-${id}">
                    <div class="info-msg">배경: 드래그 이동 / 마우스 휠 확대·축소</div>
                    <canvas id="canvas-${id}" width="1920" height="1080"></canvas>
                </div>
                <div class="panel">
                    
                    ${syncUI}

                    <div class="control-group">
                        <div class="label-row"><span>Background Image</span></div>
                        <input type="file" id="file-${id}" accept="image/*">
                        
                        <div class="label-row" style="margin-top:10px;"><span>Rotation</span> <span id="rot-val-${id}">0°</span></div>
                        <input type="range" id="rotate-${id}" min="-180" max="180" value="0">
                        
                        <div class="checkbox-group" style="margin-top:10px;">
                            <label><input type="checkbox" id="grain-${id}"> <b>🎞️ 필름 그레인 효과 (5~10%)</b></label>
                        </div>
                    </div>

                    <div class="control-group">
                        <div class="label-row"><span>Logo & Title Style</span></div>
                        <select id="logoStyle-${id}">
                            <option value="none">로고 없음</option>
                            <option value="ocn">ARCH 스타일 (OCN 오마주)</option>
                            <option value="netflix">A 마크 (넷플릭스 오마주)</option>
                        </select>
                    </div>

                    <div class="control-group" id="syncGroup1-${id}">
                        <div class="label-row"><span>Movie Title (로고 위 표시)</span></div>
                        <input type="text" id="movieTitle-${id}" placeholder="영화 제목을 직접 작성하십시오.">
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 5px 0;">

                    <div class="control-group">
                        <div class="label-row"><span>Subtitle Text</span></div>
                        <textarea id="text-${id}">${id === 0 ? '자막을 입력하십시오.' : ''}</textarea>
                    </div>

                    <div class="control-group" id="syncGroup2-${id}">
                        <div class="label-row"><span>Font Settings</span></div>
                        <select id="fontFamily-${id}">
                            <option value="pretendard">프리텐다드 (Pretendard)</option>
                            <option value="chosun">조선 굴림체 (JoseonGulim)</option>
                            <option value="gulim">일반 굴림체 (Gulim)</option>
                        </select>
                        <div class="checkbox-group" style="margin-top:5px;">
                            <label><input type="checkbox" id="bold-${id}"> 볼드</label>
                            <label><input type="checkbox" id="italic-${id}"> 이텔릭</label>
                            <label><input type="checkbox" id="outline-${id}" checked> 아웃라인(테두리)</label>
                        </div>
                    </div>

                    <div class="control-group">
                        <div class="label-row"><span>Font Size</span> <span id="size-val-${id}">60px</span></div>
                        <input type="range" id="size-${id}" min="20" max="200" value="60">
                        
                        <div class="label-row" style="margin-top:10px;"><span>Text Vertical Position (상하 위치)</span></div>
                        <input type="range" id="textY-${id}" min="-500" max="500" value="0">
                        
                        <div class="label-row" style="margin-top:10px; align-items:center;" id="syncGroup3-${id}">
                            <span>Subtitle Color (자막 색상)</span>
                            <input type="color" id="color-${id}" value="#ffffff" style="width:50px; padding:0; height:30px; border:none; cursor:pointer;">
                        </div>
                    </div>

                </div>
            `;
            workspace.appendChild(card);
            initEvents(id);
            toggleSyncUI(id); // 생성 시 초기 UI 잠금 설정
            draw(id);
        }

        // 동기화 상태에 따른 패널 UI 잠금/해제 함수
        function toggleSyncUI(id) {
            if (id === 0) return;
            const isSynced = scenes[id].syncMaster;
            const groups = [`syncGroup1-${id}`, `syncGroup2-${id}`, `syncGroup3-${id}`];
            groups.forEach(gId => {
                const el = document.getElementById(gId);
                if(el) {
                    if(isSynced) el.classList.add('locked-ui');
                    else el.classList.remove('locked-ui');
                }
            });
        }

        function initEvents(id) {
            const s = scenes[id];
            const canvas = document.getElementById(`canvas-${id}`);
            const wrap = document.getElementById(`wrap-${id}`);

            // 동기화 토글 리스너
            const syncCheck = document.getElementById(`sync-${id}`);
            if (syncCheck) {
                syncCheck.addEventListener('change', e => {
                    s.syncMaster = e.target.checked;
                    toggleSyncUI(id);
                    draw(id); // 즉시 갱신
                });
            }

            document.getElementById(`file-${id}`).addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = event => {
                    const img = new Image();
                    img.onload = () => { 
                        s.img = img; s.imgX = 0; s.imgY = 0; s.scale = 1; s.rotate = 0;
                        document.getElementById(`rotate-${id}`).value = 0; draw(id); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 개별 컨트롤 패널 리스너
            document.getElementById(`rotate-${id}`).oninput = e => { s.rotate = parseInt(e.target.value); document.getElementById(`rot-val-${id}`).innerText = s.rotate + "°"; draw(id); };
            document.getElementById(`logoStyle-${id}`).onchange = e => { s.logoStyle = e.target.value; redrawAll(); };
            document.getElementById(`grain-${id}`).onchange = e => { s.filmGrain = e.target.checked; draw(id); };
            
            document.getElementById(`text-${id}`).oninput = e => { s.text = e.target.value; draw(id); };
            document.getElementById(`textY-${id}`).oninput = e => { s.textY = parseInt(e.target.value); draw(id); };
            document.getElementById(`size-${id}`).oninput = e => { s.fontSize = parseInt(e.target.value); document.getElementById(`size-val-${id}`).innerText = s.fontSize + "px"; draw(id); };
            
            // 동기화 대상 속성들 (1번 컷에서 변경 시 전체 리렌더링)
            const syncUpdate = () => { id === 0 ? redrawAll() : draw(id); };
            document.getElementById(`movieTitle-${id}`).oninput = e => { s.movieTitle = e.target.value; syncUpdate(); };
            document.getElementById(`color-${id}`).onchange = e => { s.textColor = e.target.value; syncUpdate(); };
            document.getElementById(`fontFamily-${id}`).onchange = e => { s.fontFamily = e.target.value; syncUpdate(); };
            document.getElementById(`bold-${id}`).onchange = e => { s.isBold = e.target.checked; syncUpdate(); };
            document.getElementById(`italic-${id}`).onchange = e => { s.isItalic = e.target.checked; syncUpdate(); };
            document.getElementById(`outline-${id}`).onchange = e => { s.isOutline = e.target.checked; syncUpdate(); };

            wrap.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomIntensity = 0.001;
                s.scale -= e.deltaY * zoomIntensity;
                if(s.scale < 0.1) s.scale = 0.1;
                if(s.scale > 10) s.scale = 10;
                draw(id);
            }, { passive: false });

            let startX, startY;
            wrap.onmousedown = e => {
                if(!s.img) return;
                s.isDraggingImg = true;
                startX = e.clientX; startY = e.clientY;
            };

            window.addEventListener('mousemove', e => {
                if (!s.isDraggingImg) return;
                const rect = canvas.getBoundingClientRect();
                const ratioX = canvas.width / rect.width;
                const ratioY = canvas.height / rect.height;
                s.imgX += (e.clientX - startX) * ratioX;
                s.imgY += (e.clientY - startY) * ratioY;
                startX = e.clientX; startY = e.clientY;
                draw(id);
            });

            window.addEventListener('mouseup', () => { s.isDraggingImg = false; });
        }

        function draw(id) {
            const s = scenes[id];
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;  
            const h = canvas.height; 

            // 동기화 로직: 1번 컷(id 0)의 데이터를 복제하여 적용
            let drawState = { ...s };
            if (s.syncMaster && id !== 0 && scenes[0]) {
                drawState.movieTitle = scenes[0].movieTitle;
                drawState.fontFamily = scenes[0].fontFamily;
                drawState.textColor = scenes[0].textColor;
                drawState.isBold = scenes[0].isBold;
                drawState.isItalic = scenes[0].isItalic;
                drawState.isOutline = scenes[0].isOutline;
            }

            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, w, h);

            if (drawState.img) {
                ctx.save();
                ctx.translate(w / 2 + drawState.imgX, h / 2 + drawState.imgY);
                ctx.rotate(drawState.rotate * Math.PI / 180);
                const ratio = Math.max(w / drawState.img.width, h / drawState.img.height);
                ctx.scale(ratio * drawState.scale, ratio * drawState.scale);
                ctx.drawImage(drawState.img, -drawState.img.width / 2, -drawState.img.height / 2);
                ctx.restore();
            }

            // 필름 그레인 텍스처 오버레이 (이미지 위에 덮고 자막 아래로)
            if (drawState.filmGrain) {
                ctx.save();
                ctx.fillStyle = ctx.createPattern(noiseCanvas, 'repeat');
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }

            // 시네마틱 레터박스
            const lh = h * 0.12;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, w, lh);
            ctx.fillRect(0, h - lh, w, lh);

            // 로고 & 타이틀 렌더링
            if(drawState.logoStyle !== 'none') {
                ctx.save();
                const logoY = 65; 
                let titleAlignY = logoY - 8;

                if (drawState.logoStyle === 'ocn') {
                    const logoW = 125, logoH = 40, logoX = w - logoW - 50; 
                    
                    if (drawState.movieTitle.trim() !== "") {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = 'bold 18px "Pretendard", sans-serif';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                        ctx.fillText(drawState.movieTitle, logoX + (logoW / 2), titleAlignY);
                    }
                    ctx.fillStyle = globalAccentColor;
                    ctx.beginPath(); ctx.roundRect(logoX, logoY, logoW, logoH, 4); ctx.fill();
                    ctx.fillStyle = "#000000";
                    ctx.font = '900 30px "Arial Black", sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('ARCH', logoX + (logoW / 2), logoY + (logoH / 2) + 2); 

                } else if (drawState.logoStyle === 'netflix') {
                    // 넷플릭스 A 마크 패러디
                    const logoX = w - 70;
                    
                    if (drawState.movieTitle.trim() !== "") {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = 'bold 18px "Pretendard", sans-serif';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                        ctx.fillText(drawState.movieTitle, logoX, titleAlignY);
                    }
                    
                    ctx.fillStyle = "var(--netflix)";
                    ctx.font = 'italic 900 65px "Arial Black", sans-serif'; // 넷플릭스 특유의 폰트감
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                    // 그림자로 입체감 추가
                    ctx.shadowColor = "rgba(0,0,0,0.8)";
                    ctx.shadowBlur = 10;
                    ctx.fillText('A', logoX, logoY - 5);
                }
                ctx.restore();
            }

            // 자막 렌더링
            if (drawState.text) {
                ctx.save();
                let fontFace = "'Pretendard', sans-serif";
                if(drawState.fontFamily === 'chosun') fontFace = "'JoseonGulim', sans-serif";
                if(drawState.fontFamily === 'gulim') fontFace = "'Gulim', 굴림, sans-serif";

                const fontStyle = `${drawState.isItalic ? 'italic ' : ''}${drawState.isBold ? 'bold ' : ''}${drawState.fontSize}px ${fontFace}`;
                ctx.font = fontStyle;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.letterSpacing = "-2px";

                const lines = drawState.text.split('\n');
                const lineH = drawState.fontSize * 1.3;
                const centerX = w / 2;
                const startY = h - (h * 0.08) - drawState.textY - ((lines.length - 1) * lineH);

                lines.forEach((line, i) => {
                    const py = startY + (i * lineH);
                    if(drawState.isOutline) {
                        ctx.strokeStyle = "#000"; ctx.lineWidth = drawState.fontSize * 0.15;
                        ctx.lineJoin = "round"; ctx.strokeText(line, centerX, py);
                    }
                    ctx.fillStyle = drawState.textColor;
                    ctx.fillText(line, centerX, py);
                });
                ctx.restore();
            }
        }

        function deleteScene(id) {
            delete scenes[id];
            const el = document.getElementById(`card-${id}`);
            if(el) el.remove();
        }

        function exportImages() {
            const activeIds = Object.keys(scenes).sort((a,b) => a - b);
            if (activeIds.length === 0) return;
            const master = document.createElement('canvas');
            master.width = 1920;
            master.height = 1080 * activeIds.length;
            const mctx = master.getContext('2d');

            activeIds.forEach((id, i) => {
                const sceneCanvas = document.getElementById(`canvas-${id}`);
                mctx.drawImage(sceneCanvas, 0, i * 1080);
            });

            const link = document.createElement('a');
            link.download = 'ARCH_CINEMA_MASTER_RENDER.png';
            link.href = master.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
