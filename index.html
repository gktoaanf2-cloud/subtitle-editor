<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보스의 애니 자막 에디터 - PRO</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Malgun Gothic', sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ff5e5e; }
        .editor-container { display: flex; flex-direction: column; align-items: center; gap: 30px; margin-bottom: 50px; }
        
        /* 씬(Scene) 블록 디자인 */
        .scene-block { display: flex; flex-direction: row; flex-wrap: wrap; gap: 20px; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 1200px; justify-content: center; }
        .canvas-area { width: 800px; max-width: 100%; }
        canvas { width: 100%; height: auto; background: #000; border-radius: 4px; border: 1px solid #444; }
        
        /* 컨트롤 패널 디자인 */
        .controls { display: flex; flex-direction: column; gap: 15px; width: 320px; text-align: left; background: #252525; padding: 20px; border-radius: 8px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 13px; font-weight: bold; color: #aaa; }
        .row-group { display: flex; gap: 15px; justify-content: space-between; }
        .row-group > div { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        
        /* 인풋 및 버튼 디자인 */
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ff5e5e; }
        input[type="file"] { font-size: 14px; padding: 5px; background: #333; border-radius: 4px; color: white; cursor: pointer; }
        textarea { width: 100%; height: 60px; padding: 10px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; resize: none; font-family: 'Gulim', sans-serif; box-sizing: border-box; }
        
        .btn { background-color: #ff5e5e; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background-color: #ff3333; transform: translateY(-2px); }
        .btn-add { background-color: #4CAF50; margin-bottom: 20px; }
        .btn-add:hover { background-color: #45a049; }
        .btn-remove { background-color: transparent; color: #ff5e5e; border: 1px solid #ff5e5e; padding: 5px 10px; font-size: 12px; margin-top: 10px; }
        .btn-remove:hover { background-color: #ff5e5e; color: black; }
        
        /* 체크박스 디자인 */
        .checkbox-group { display: flex; gap: 15px; align-items: center; margin-top: 5px; }
        .checkbox-group label { flex-direction: row; display: flex; align-items: center; gap: 5px; font-size: 14px; color: white; cursor: pointer;}
    </style>
</head>
<body>

    <h1>🎬 보스의 영화/애니 자막 에디터 [PRO]</h1>
    
    <div id="workspace" class="editor-container">
        </div>

    <div>
        <button class="btn btn-add" id="addSceneBtn">+ 새로운 컷(Scene) 이어붙이기</button>
        <br>
        <button class="btn" id="exportAllBtn">💾 전체 이미지 병합 다운로드</button>
    </div>

    <script>
        const workspace = document.getElementById('workspace');
        let sceneCounter = 0;
        const sceneStates = {}; // 각 씬의 데이터를 저장하는 중앙 통제소

        // 초기 첫 번째 씬 생성
        createSceneBlock();

        document.getElementById('addSceneBtn').addEventListener('click', createSceneBlock);
        document.getElementById('exportAllBtn').addEventListener('click', exportMergedImage);

        // 1. 새로운 씬을 생성하고 HTML을 조립하는 함수
        function createSceneBlock() {
            const id = sceneCounter++;
            
            // 각 씬의 기본 상태값 뼈대 설정
            sceneStates[id] = {
                img: null,
                x: 0,
                y: 0,
                scale: 1,
                rotate: 0,
                text: '자막을 입력하십시오.',
                fontSize: 36,
                bold: false,
                italic: false
            };

            const block = document.createElement('div');
            block.className = 'scene-block';
            block.id = `scene-${id}`;

            block.innerHTML = `
                <div class="canvas-area">
                    <canvas id="canvas-${id}" width="800" height="450"></canvas>
                </div>
                <div class="controls">
                    <div class="control-group">
                        <label>배경 이미지 업로드</label>
                        <input type="file" id="upload-${id}" accept="image/*">
                    </div>
                    
                    <div class="row-group">
                        <div>
                            <label>확대/축소</label>
                            <input type="range" id="scale-${id}" min="0.1" max="3" step="0.01" value="1">
                        </div>
                        <div>
                            <label>회전 (도)</label>
                            <input type="range" id="rotate-${id}" min="-180" max="180" step="1" value="0">
                        </div>
                    </div>
                    
                    <div class="row-group">
                        <div>
                            <label>좌우 이동 (X)</label>
                            <input type="range" id="x-${id}" min="-800" max="800" step="1" value="0">
                        </div>
                        <div>
                            <label>상하 이동 (Y)</label>
                            <input type="range" id="y-${id}" min="-450" max="450" step="1" value="0">
                        </div>
                    </div>
                    
                    <hr style="border-color: #444; margin: 10px 0; width: 100%;">
                    
                    <div class="control-group">
                        <label>자막 텍스트 (굴림체 고정)</label>
                        <textarea id="text-${id}">자막을 입력하십시오.</textarea>
                    </div>
                    
                    <div class="control-group">
                        <label>자막 크기</label>
                        <input type="range" id="fontSize-${id}" min="10" max="100" step="1" value="36">
                    </div>
                    
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="bold-${id}"> <b>볼드체 (Bold)</b></label>
                        <label><input type="checkbox" id="italic-${id}"> <i>이탤릭체 (Italic)</i></label>
                    </div>
                    
                    ${id > 0 ? `<button class="btn-remove" onclick="removeScene(${id})">X 이 컷 삭제하기</button>` : ''}
                </div>
            `;
            
            workspace.appendChild(block);
            attachListeners(id);
            renderCanvas(id); // 빈 캔버스 초기화 (블랙박스 랜더링)
        }

        // 2. 컨트롤 패널 조작 시 캔버스 즉각 반영 로직
        function attachListeners(id) {
            const state = sceneStates[id];
            
            document.getElementById(`upload-${id}`).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        state.img = img;
                        // X,Y,Scale 기본값 리셋
                        state.scale = 1; state.x = 0; state.y = 0; state.rotate = 0;
                        document.getElementById(`scale-${id}`).value = 1;
                        document.getElementById(`rotate-${id}`).value = 0;
                        document.getElementById(`x-${id}`).value = 0;
                        document.getElementById(`y-${id}`).value = 0;
                        renderCanvas(id);
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            });

            // 슬라이더 및 텍스트 리스너
            const updateState = (key, parseFunc) => (e) => {
                state[key] = parseFunc ? parseFunc(e.target.value) : e.target.value;
                renderCanvas(id);
            };

            document.getElementById(`scale-${id}`).addEventListener('input', updateState('scale', parseFloat));
            document.getElementById(`rotate-${id}`).addEventListener('input', updateState('rotate', parseInt));
            document.getElementById(`x-${id}`).addEventListener('input', updateState('x', parseInt));
            document.getElementById(`y-${id}`).addEventListener('input', updateState('y', parseInt));
            document.getElementById(`fontSize-${id}`).addEventListener('input', updateState('fontSize', parseInt));
            document.getElementById(`text-${id}`).addEventListener('input', updateState('text', null));
            
            document.getElementById(`bold-${id}`).addEventListener('change', (e) => { state.bold = e.target.checked; renderCanvas(id); });
            document.getElementById(`italic-${id}`).addEventListener('change', (e) => { state.italic = e.target.checked; renderCanvas(id); });
        }

        // 3. 단일 캔버스 렌더링 (가장 핵심적인 그리기 로직)
        function renderCanvas(id) {
            const state = sceneStates[id];
            const canvas = document.getElementById(`canvas-${id}`);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;  // 800
            const h = canvas.height; // 450 (16:9 비율)

            // 전체 캔버스를 검정색으로 초기화
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            // 이미지 배치 및 변형 적용
            if (state.img) {
                ctx.save();
                // 캔버스 중앙으로 기준점 이동
                ctx.translate(w / 2 + state.x, h / 2 + state.y);
                ctx.rotate(state.rotate * Math.PI / 180);
                
                // 이미지가 16:9 비율을 덮도록 기본 스케일 계산 (Cover)
                const baseScale = Math.max(w / state.img.width, h / state.img.height);
                const finalScale = baseScale * state.scale;
                
                ctx.scale(finalScale, finalScale);
                // 이미지를 중앙 기준으로 그림
                ctx.drawImage(state.img, -state.img.width / 2, -state.img.height / 2);
                ctx.restore();
            }

            // 위아래 블랙박스 (레터박스) 덧그리기 (높이의 12%)
            const barHeight = h * 0.12;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, barHeight); // 상단
            ctx.fillRect(0, h - barHeight, w, barHeight); // 하단

            // 자막 텍스트 렌더링
            if (state.text.trim() !== '') {
                // 요구하신 굴림체, 볼드, 이탤릭 조합 설정
                const fontStyle = `${state.italic ? 'italic ' : ''}${state.bold ? 'bold ' : ''}${state.fontSize}px 'Gulim', 굴림, sans-serif`;
                ctx.font = fontStyle;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                
                // 요구하신 '자간 -75'를 캔버스 규격(LetterSpacing)에 맞게 조정
                ctx.letterSpacing = "-2px"; 

                // 줄바꿈 대응 로직
                const lines = state.text.split('\n');
                const lineHeight = state.fontSize * 1.3;
                // 가장 아랫줄이 캔버스 하단에서 6% 떨어진 곳에 위치하도록 설정
                const startY = h - (h * 0.06) - ((lines.length - 1) * lineHeight);

                lines.forEach((line, index) => {
                    const textY = startY + (index * lineHeight);
                    
                    // 두꺼운 검은 테두리
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = state.fontSize * 0.15;
                    ctx.lineJoin = 'round';
                    ctx.strokeText(line, w / 2, textY);
                    
                    // 내부 흰색 글씨
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(line, w / 2, textY);
                });
            }
        }

        // 4. 특정 씬 삭제
        function removeScene(id) {
            delete sceneStates[id];
            const block = document.getElementById(`scene-${id}`);
            if (block) block.remove();
        }

        // 5. 모든 캔버스를 세로로 이어붙여 다운로드
        function exportMergedImage() {
            const activeIds = Object.keys(sceneStates).sort((a,b) => a - b);
            if(activeIds.length === 0) return;

            // 마스터 캔버스 생성
            const masterCanvas = document.createElement('canvas');
            const blockWidth = 800;
            const blockHeight = 450;
            
            masterCanvas.width = blockWidth;
            masterCanvas.height = blockHeight * activeIds.length;
            const masterCtx = masterCanvas.getContext('2d');

            // 각 씬의 캔버스를 순서대로 복사하여 마스터에 붙여넣기
            activeIds.forEach((id, index) => {
                const sceneCanvas = document.getElementById(`canvas-${id}`);
                masterCtx.drawImage(sceneCanvas, 0, index * blockHeight);
            });

            // 다운로드 트리거
            const link = document.createElement('a');
            link.download = 'boss_cinematic_cut.png';
            link.href = masterCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
