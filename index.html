<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Editor | SF Edition</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #111111;
            --accent-cyan: #00f3ff;
            --accent-pink: #ff0055;
            --border-color: #222222;
            --text-main: #e0e0e0;
            --text-dim: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* SF 배경 격자 무늬 */
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 40px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-cyan), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 60px;
            width: 100%;
            max-width: 1280px;
        }

        /* Scene Block - Glassmorphism 적용 */
        .scene-card {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        @media (max-width: 1100px) {
            .scene-card { grid-template-columns: 1fr; }
        }

        .canvas-wrap {
            position: relative;
            cursor: move;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            display: block;
            background: #000;
        }

        /* SF 테마 컨트롤 패널 */
        .panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 10px;
        }

        .panel-section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .label-row span.val { color: var(--accent-cyan); }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-cyan);
            margin: 10px 0;
            cursor: pointer;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px dashed var(--text-dim);
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-family: 'Gulim', sans-serif;
            resize: none;
            box-sizing: border-box;
        }

        .color-picker-wrap {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            background: transparent;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 40px;
        }

        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent-cyan);
        }

        .btn-add {
            background: transparent;
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-export {
            background: var(--accent-cyan);
        }

        .btn-remove {
            position: absolute;
            top: -15px;
            right: -15px;
            background: var(--accent-pink);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .info-msg {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            margin-bottom: 5px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <h1>Cinema Editor</h1>
    
    <div id="workspace" class="workspace"></div>

    <div class="btn-group">
        <button class="btn btn-add" id="addScene">＋ Add Scene</button>
        <button class="btn btn-export" id="exportAll">💾 Render & Export</button>
    </div>

    <script>
        const workspace = document.getElementById('workspace');
        let sceneCounter = 0;
        const scenes = {};

        // 초기 생성
        createScene();

        document.getElementById('addScene').addEventListener('click', createScene);
        document.getElementById('exportAll').addEventListener('click', exportImages);

        function createScene() {
            const id = sceneCounter++;
            scenes[id] = {
                img: null,
                imgX: 0, imgY: 0, scale: 1, rotate: 0,
                text: "자막을 입력하십시오.",
                textX: 0, textY: 0, // 0 = 하단 기준점
                fontSize: 40,
                color: "#ffffff",
                bold: true, italic: false,
                isDraggingImg: false,
                isDraggingText: false
            };

            const card = document.createElement('div');
            card.className = 'scene-card';
            card.id = `card-${id}`;
            card.innerHTML = `
                <button class="btn-remove" onclick="deleteScene(${id})">×</button>
                <div class="canvas-wrap" id="wrap-${id}">
                    <div class="info-msg">이미지나 자막을 마우스로 직접 잡고 움직이십시오.</div>
                    <canvas id="canvas-${id}" width="1280" height="720"></canvas>
                </div>
                <div class="panel">
                    <div class="panel-section">
                        <div class="label-row">Background Image</div>
                        <input type="file" id="file-${id}" accept="image/*">
                        <input type="range" id="scale-${id}" min="0.1" max="5" step="0.01" value="1">
                        <div class="label-row">Rotation <span class="val" id="rot-val-${id}">0°</span></div>
                        <input type="range" id="rotate-${id}" min="-180" max="180" value="0">
                    </div>
                    <div class="panel-section">
                        <div class="label-row">Subtitle Config</div>
                        <textarea id="text-${id}">자막을 입력하십시오.</textarea>
                        <div class="label-row">Font Size <span class="val" id="size-val-${id}">40px</span></div>
                        <input type="range" id="size-${id}" min="10" max="150" value="40">
                        <div class="color-picker-wrap">
                            <input type="color" id="color-${id}" value="#ffffff">
                            <span style="font-size:0.8rem; font-weight:700;">TEXT COLOR WHEEL</span>
                        </div>
                    </div>
                </div>
            `;
            workspace.appendChild(card);
            initEvents(id);
            draw(id);
        }

        function initEvents(id) {
            const s = scenes[id];
            const canvas = document.getElementById(`canvas-${id}`);
            const wrap = document.getElementById(`wrap-${id}`);

            // 파일 업로드
            document.getElementById(`file-${id}`).addEventListener('change', e => {
                const reader = new FileReader();
                reader.onload = event => {
                    const img = new Image();
                    img.onload = () => { s.img = img; draw(id); };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            });

            // 입력 제어
            document.getElementById(`scale-${id}`).oninput = e => { s.scale = parseFloat(e.target.value); draw(id); };
            document.getElementById(`rotate-${id}`).oninput = e => { 
                s.rotate = parseInt(e.target.value); 
                document.getElementById(`rot-val-${id}`).innerText = s.rotate + "°";
                draw(id); 
            };
            document.getElementById(`size-${id}`).oninput = e => { 
                s.fontSize = parseInt(e.target.value); 
                document.getElementById(`size-val-${id}`).innerText = s.fontSize + "px";
                draw(id); 
            };
            document.getElementById(`text-${id}`).oninput = e => { s.text = e.target.value; draw(id); };
            document.getElementById(`color-${id}`).onchange = e => { s.color = e.target.value; draw(id); };

            // 🖱️ 캔버스 자유 드래그 엔진
            let startX, startY;

            wrap.onmousedown = e => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
                const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
                
                startX = mouseX;
                startY = mouseY;

                // 자막 위치인지 확인 (단순 거리 계산)
                const textBaseY = canvas.height - 100 + s.textY;
                if (Math.abs(mouseY - textBaseY) < 100) {
                    s.isDraggingText = true;
                } else {
                    s.isDraggingImg = true;
                }
            };

            window.onmousemove = e => {
                if (!s.isDraggingImg && !s.isDraggingText) return;
                
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
                const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

                const dx = mouseX - startX;
                const dy = mouseY - startY;

                if (s.isDraggingImg) {
                    s.imgX += dx;
                    s.imgY += dy;
                } else if (s.isDraggingText) {
                    s.textX += dx;
                    s.textY += dy;
                }

                startX = mouseX;
                startY = mouseY;
                draw(id);
            };

            window.onmouseup = () => {
                s.isDraggingImg = false;
                s.isDraggingText = false;
            };
        }

        function draw(id) {
            const s = scenes[id];
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, w, h);

            if (s.img) {
                ctx.save();
                ctx.translate(w / 2 + s.imgX, h / 2 + s.imgY);
                ctx.rotate(s.rotate * Math.PI / 180);
                const ratio = Math.max(w / s.img.width, h / s.img.height);
                ctx.scale(ratio * s.scale, ratio * s.scale);
                ctx.drawImage(s.img, -s.img.width / 2, -s.img.height / 2);
                ctx.restore();
            }

            // 시네마틱 레터박스 (위아래 12%)
            const lh = h * 0.12;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, w, lh);
            ctx.fillRect(0, h - lh, w, lh);

            // 자막 렌더링
            if (s.text) {
                const fontStyle = `${s.italic ? 'italic ' : ''}${s.bold ? 'bold ' : ''}${s.fontSize}px 'Gulim', sans-serif`;
                ctx.font = fontStyle;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.letterSpacing = "-3px"; // 자간 -75 근사치

                const lines = s.text.split('\n');
                const lineH = s.fontSize * 1.2;
                
                // 위치 계산 (X축도 자유 이동)
                const centerX = w / 2 + s.textX;
                const startY = h - (h * 0.08) + s.textY - ((lines.length - 1) * lineH);

                lines.forEach((line, i) => {
                    const py = startY + (i * lineH);
                    // 그림자 효과
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = s.fontSize * 0.15;
                    ctx.lineJoin = "round";
                    ctx.strokeText(line, centerX, py);
                    // 메인 텍스트
                    ctx.fillStyle = s.color;
                    ctx.fillText(line, centerX, py);
                });
            }
        }

        function deleteScene(id) {
            delete scenes[id];
            document.getElementById(`card-${id}`).remove();
        }

        function exportImages() {
            const activeIds = Object.keys(scenes).sort((a,b) => a - b);
            if (activeIds.length === 0) return;

            const master = document.createElement('canvas');
            master.width = 1280;
            master.height = 720 * activeIds.length;
            const mctx = master.getContext('2d');

            activeIds.forEach((id, i) => {
                mctx.drawImage(document.getElementById(`canvas-${id}`), 0, i * 720);
            });

            const link = document.createElement('a');
            link.download = 'Cinema_Editor_Render.png';
            link.href = master.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
