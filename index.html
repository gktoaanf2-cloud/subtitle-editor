<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCH CINEMA EDITOR</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'JoseonGulim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff');
            font-weight: normal; font-display: swap;
        }
        :root {
            --bg:#E8DFD0;--bg2:#DDD4C4;--panel:#D9D0C1;--panel2:#E2DAC9;
            --bdr:#B5AA98;--bdr-l:#C8BFB0;--acc:#8B7355;--acc-g:#C4A87C;
            --tx:#3C3428;--tx-m:#8B7D6B;--tx-l:#A89E8E;--danger:#9E4B4B;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,sans-serif;min-height:100vh;overflow-x:hidden;}
        body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;}

        /* ── Header ── */
        .site-header{text-align:center;padding:40px 20px 24px;}
        .h-line{width:60px;height:1px;background:var(--acc);margin:0 auto 16px;}
        .h-dia{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
        .h-dia::before,.h-dia::after{content:'';width:36px;height:1px;background:var(--bdr);}
        .dia{width:7px;height:7px;background:var(--acc);transform:rotate(45deg);flex-shrink:0;}
        .site-title{font-family:'Noto Serif KR',serif;font-weight:300;font-size:1.5rem;letter-spacing:10px;text-transform:uppercase;}
        .site-sub{font-size:.65rem;letter-spacing:4px;color:var(--tx-m);margin-top:6px;text-transform:uppercase;}

        /* ── Top Mode Switch ── */
        .mode-switch{display:flex;justify-content:center;gap:0;margin:20px auto 30px;max-width:400px;border:1px solid var(--bdr);}
        .mode-btn{flex:1;padding:10px 0;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;background:var(--panel);color:var(--tx-m);border:none;font-family:inherit;transition:all .15s;}
        .mode-btn.active{background:var(--acc);color:var(--bg);}
        .mode-btn:not(:last-child){border-right:1px solid var(--bdr);}

        .mode-area{display:none;max-width:1440px;margin:0 auto;padding:0 20px 60px;}
        .mode-area.active{display:block;}

        /* ══════════ SHARED UI ══════════ */
        .section-head{display:flex;align-items:center;gap:8px;font-size:.63rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--tx-m);margin-bottom:4px;}
        .section-head::after{content:'';flex:1;height:1px;background:var(--bdr-l);}
        .ctrl{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
        .ctrl-label{display:flex;justify-content:space-between;font-size:.67rem;color:var(--tx-m);letter-spacing:1px;}
        input[type="range"]{-webkit-appearance:none;width:100%;height:2px;background:var(--bdr);outline:none;}
        input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--acc);border:2px solid var(--bg);border-radius:50%;cursor:pointer;}
        input[type="text"],select,textarea{width:100%;padding:7px 10px;background:var(--panel2);border:1px solid var(--bdr-l);color:var(--tx);font-family:inherit;font-size:.78rem;outline:none;transition:border-color .15s;}
        input[type="text"]:focus,select:focus,textarea:focus{border-color:var(--acc);}
        textarea{height:68px;resize:none;}
        select{cursor:pointer;}
        input[type="file"]{font-size:.73rem;color:var(--tx-m);}
        input[type="file"]::file-selector-button{background:var(--panel2);color:var(--tx);border:1px solid var(--bdr);padding:4px 12px;font-size:.7rem;cursor:pointer;font-family:inherit;letter-spacing:1px;margin-right:8px;transition:background .15s;}
        input[type="file"]::file-selector-button:hover{background:var(--bdr-l);}
        input[type="checkbox"]{accent-color:var(--acc);}
        .check-row{display:flex;gap:12px;font-size:.76rem;flex-wrap:wrap;}
        .check-row label{display:flex;align-items:center;gap:4px;cursor:pointer;}
        .sep{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0;}
        .sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--bdr-l);}

        .btn{padding:10px 32px;font-family:'Noto Serif KR',serif;font-weight:500;font-size:.8rem;letter-spacing:3px;cursor:pointer;transition:all .2s;text-transform:uppercase;border:1px solid var(--bdr);background:var(--panel);color:var(--tx);}
        .btn:hover{background:var(--acc);color:var(--bg);border-color:var(--acc);}
        .btn-p{background:var(--acc);color:var(--bg);border-color:var(--acc);}
        .btn-p:hover{background:var(--tx);border-color:var(--tx);}
        .btn-sm{padding:5px 12px;font-size:.68rem;font-family:inherit;letter-spacing:1px;cursor:pointer;border:1px solid var(--bdr);background:var(--panel2);color:var(--tx);transition:all .15s;}
        .btn-sm:hover{background:var(--bdr-l);}

        /* ══════════ SUBTITLE MODE ══════════ */
        .sub-workspace{display:flex;flex-direction:column;gap:44px;}
        .scene-card{display:grid;grid-template-columns:1fr 350px;background:var(--panel);border:1px solid var(--bdr);position:relative;overflow:hidden;}
        .scene-card::before{content:'';position:absolute;inset:4px;border:1px solid var(--bdr-l);pointer-events:none;z-index:5;}
        @media(max-width:1100px){.scene-card{grid-template-columns:1fr;}}
        .scene-tag{position:absolute;top:10px;left:10px;font-family:'Noto Serif KR',serif;font-size:.6rem;letter-spacing:3px;color:var(--tx-m);text-transform:uppercase;z-index:10;background:var(--panel);padding:2px 7px;border:1px solid var(--bdr-l);}
        .canvas-wrap{background:#1a1815;display:flex;align-items:center;justify-content:center;position:relative;cursor:grab;overflow:hidden;min-height:380px;}
        .canvas-wrap:active{cursor:grabbing;}
        .canvas-wrap canvas{width:100%;height:auto;display:block;}
        .canvas-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:.6rem;letter-spacing:1px;color:rgba(255,255,255,.25);pointer-events:none;z-index:6;white-space:nowrap;}
        .s-panel{padding:20px;border-left:1px solid var(--bdr);display:flex;flex-direction:column;gap:14px;max-height:680px;overflow-y:auto;background:var(--panel);}
        .s-panel::-webkit-scrollbar{width:4px;}
        .s-panel::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
        .sync-box{background:rgba(139,115,85,.1);border:1px solid rgba(139,115,85,.3);padding:7px 10px;font-size:.73rem;color:var(--acc);font-weight:600;display:flex;align-items:center;gap:5px;}
        .locked-ui{opacity:.35;pointer-events:none;}
        .btn-del-scene{position:absolute;top:10px;right:10px;z-index:10;background:var(--panel);border:1px solid var(--danger);color:var(--danger);padding:3px 9px;font-size:.6rem;font-family:inherit;letter-spacing:1px;cursor:pointer;}
        .btn-del-scene:hover{background:var(--danger);color:#fff;}
        .sub-footer{display:flex;justify-content:center;gap:14px;margin-top:30px;}
        .color-pick{display:flex;align-items:center;gap:8px;}
        .color-pick input[type="color"]{width:34px;height:22px;border:1px solid var(--bdr);background:var(--panel2);cursor:pointer;padding:1px;}

        /* ══════════ COLLAGE MODE ══════════ */
        .col-layout{display:grid;grid-template-columns:1fr 340px;gap:0;background:var(--panel);border:1px solid var(--bdr);position:relative;min-height:500px;}
        .col-layout::before{content:'';position:absolute;inset:4px;border:1px solid var(--bdr-l);pointer-events:none;z-index:5;}
        @media(max-width:1000px){.col-layout{grid-template-columns:1fr;}}
        .col-preview{background:#1a1815;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px;position:relative;}
        .col-preview canvas{max-width:100%;max-height:600px;display:block;background:#000;}
        .col-panel{padding:20px;border-left:1px solid var(--bdr);display:flex;flex-direction:column;gap:14px;max-height:700px;overflow-y:auto;}
        .col-panel::-webkit-scrollbar{width:4px;}
        .col-panel::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}

        /* image strip items */
        .strip-list{display:flex;flex-direction:column;gap:3px;}
        .strip-item{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel2);border:1px solid transparent;font-size:.73rem;cursor:pointer;transition:all .1s;}
        .strip-item:hover{border-color:var(--bdr);}
        .strip-item.active{border-color:var(--acc);background:rgba(139,115,85,.12);}
        .strip-thumb{width:40px;height:28px;object-fit:cover;border:1px solid var(--bdr-l);flex-shrink:0;}
        .strip-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .strip-item button{background:none;border:none;color:var(--tx-m);cursor:pointer;font-size:.68rem;padding:2px 4px;}
        .strip-item button:hover{color:var(--danger);}
        .strip-actions{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;}

        /* filter presets */
        .filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
        .filter-chip{padding:6px 0;text-align:center;font-size:.68rem;letter-spacing:1px;cursor:pointer;border:1px solid var(--bdr-l);background:var(--panel2);color:var(--tx-m);transition:all .1s;}
        .filter-chip:hover{border-color:var(--bdr);}
        .filter-chip.active{border-color:var(--acc);color:var(--acc);background:rgba(139,115,85,.1);}

        .col-footer{display:flex;justify-content:center;gap:14px;margin-top:24px;}

        .col-empty{text-align:center;color:var(--tx-l);font-size:.75rem;padding:40px 0;letter-spacing:1px;}

        /* per-image ctrl */
        .img-ctrl{margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr-l);display:flex;flex-direction:column;gap:8px;}
    </style>
</head>
<body>

<header class="site-header">
    <div class="h-line"></div>
    <div class="h-dia"><div class="dia"></div></div>
    <h1 class="site-title">Arch Cinema</h1>
    <p class="site-sub">Scene Composition Editor</p>
</header>

<!-- ── Mode Switch ── -->
<div class="mode-switch">
    <button class="mode-btn active" data-mode="subtitle">자막 모드</button>
    <button class="mode-btn" data-mode="collage">콜라주 모드</button>
</div>

<!-- ══════════════════════════════════════ -->
<!-- ═══  SUBTITLE MODE  ═══════════════ -->
<!-- ══════════════════════════════════════ -->
<div class="mode-area active" id="area-subtitle">
    <div class="sub-workspace" id="subWorkspace"></div>
    <div class="sub-footer">
        <button class="btn" id="subAdd">＋ 컷 추가</button>
        <button class="btn btn-p" id="subExportAll">전체 렌더링</button>
        <button class="btn" id="subExportOne">마지막 컷 저장</button>
    </div>
</div>

<!-- ══════════════════════════════════════ -->
<!-- ═══  COLLAGE MODE  ═════════════════ -->
<!-- ══════════════════════════════════════ -->
<div class="mode-area" id="area-collage">
    <div class="col-layout">
        <div class="col-preview" id="colPreviewWrap">
            <canvas id="colCanvas" width="1920" height="1080"></canvas>
        </div>
        <div class="col-panel">

            <div class="section-head">출력 설정</div>
            <div class="ctrl">
                <div class="ctrl-label"><span>최종 너비 (px)</span></div>
                <input type="text" id="colOutW" value="1920" style="width:100px;">
            </div>
            <div class="ctrl">
                <div class="ctrl-label"><span>이어붙이기 방향</span></div>
                <select id="colDir">
                    <option value="v">세로 (위→아래)</option>
                    <option value="h">가로 (왼→오른)</option>
                    <option value="grid">그리드 (정사각형)</option>
                    <option value="gridfit">그리드 (원본비율)</option>
                </select>
            </div>
            <div id="gridSettings" style="display:none;">
                <div class="ctrl">
                    <div class="ctrl-label"><span>열 수 (가로)</span><span id="gridColsVal">2</span></div>
                    <input type="range" id="gridCols" min="1" max="6" value="2">
                </div>
            </div>
            <div class="ctrl">
                <div class="ctrl-label"><span>이미지 간 간격 (px)</span></div>
                <input type="range" id="colGap" min="0" max="100" value="0">
                <div class="ctrl-label"><span></span><span id="colGapVal">0px</span></div>
            </div>
            <div class="ctrl">
                <div class="ctrl-label"><span>간격 색상</span></div>
                <div class="color-pick">
                    <input type="color" id="colGapColor" value="#000000">
                </div>
            </div>

            <div class="sep"><div class="dia"></div></div>

            <div class="section-head">이미지</div>
            <input type="file" id="colFileAdd" accept="image/*" multiple>
            <div class="strip-list" id="colStripList">
                <div class="col-empty">이미지를 추가하세요</div>
            </div>

            <!-- Per-image controls (shown when item selected) -->
            <div id="colImgCtrl" style="display:none;">
                <div class="sep"><div class="dia"></div></div>
                <div class="section-head">선택 이미지 설정</div>
                <div class="ctrl">
                    <div class="ctrl-label"><span>확대/축소</span><span id="ciScaleVal">100%</span></div>
                    <input type="range" id="ciScale" min="10" max="500" value="100">
                </div>
                <div class="ctrl">
                    <div class="ctrl-label"><span>회전</span><span id="ciRotVal">0°</span></div>
                    <input type="range" id="ciRot" min="-180" max="180" value="0">
                </div>
                <div class="ctrl">
                    <div class="ctrl-label"><span>X 오프셋</span></div>
                    <input type="range" id="ciOX" min="-1000" max="1000" value="0">
                </div>
                <div class="ctrl">
                    <div class="ctrl-label"><span>Y 오프셋</span></div>
                    <input type="range" id="ciOY" min="-1000" max="1000" value="0">
                </div>
                <div class="strip-actions">
                    <button class="btn-sm" onclick="COL.move(-1)">▲ 위로</button>
                    <button class="btn-sm" onclick="COL.move(1)">▼ 아래로</button>
                    <button class="btn-sm" onclick="COL.dup()">복제</button>
                    <button class="btn-sm" onclick="COL.del()" style="color:var(--danger);">삭제</button>
                </div>
            </div>

            <div class="sep"><div class="dia"></div></div>

            <div class="section-head">필터</div>
            <div class="filter-grid" id="colFilters">
                <div class="filter-chip" data-f="none">없음</div>
                <div class="filter-chip" data-f="grain">필름 그레인</div>
                <div class="filter-chip" data-f="bw">흑백</div>
                <div class="filter-chip" data-f="sepia">세피아</div>
                <div class="filter-chip" data-f="warm">따뜻한 톤</div>
                <div class="filter-chip" data-f="cool">차가운 톤</div>
                <div class="filter-chip" data-f="vintage">빈티지</div>
                <div class="filter-chip" data-f="highcon">고대비</div>
            </div>

            <div class="ctrl" style="margin-top:6px;">
                <div class="ctrl-label"><span>필터 강도</span><span id="colFilterStrVal">100%</span></div>
                <input type="range" id="colFilterStr" min="0" max="100" value="100">
            </div>

            <div class="ctrl" style="margin-top:8px;">
                <div class="ctrl-label"><span>그라데이션 오버레이</span></div>
                <select id="colGrad">
                    <option value="none">없음</option>
                    <option value="tb-black">위→아래 블랙</option>
                    <option value="bt-black">아래→위 블랙</option>
                    <option value="lr-black">왼→오 블랙</option>
                    <option value="tb-warm">위→아래 따뜻한</option>
                    <option value="bt-warm">아래→위 따뜻한</option>
                    <option value="tb-cool">위→아래 차가운</option>
                    <option value="custom">커스텀</option>
                </select>
            </div>
            <div id="colGradCustom" style="display:none;">
                <div class="ctrl">
                    <div class="color-pick"><span style="font-size:.67rem;">시작</span><input type="color" id="colGradC1" value="#000000"></div>
                    <div class="color-pick" style="margin-top:4px;"><span style="font-size:.67rem;">끝</span><input type="color" id="colGradC2" value="#ffffff"></div>
                </div>
            </div>

            <div class="ctrl" style="margin-top:6px;">
                <div class="ctrl-label"><span>그라데이션 강도</span><span id="colGradAVal">40%</span></div>
                <input type="range" id="colGradA" min="0" max="100" value="40">
            </div>

        </div>
    </div>

    <div class="col-footer">
        <button class="btn btn-p" onclick="COL.exportImg()">렌더링 저장</button>
    </div>
</div>

<script>
(() => {
    // ── Mode switch ──
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.mode-area').forEach(a => a.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('area-' + btn.dataset.mode).classList.add('active');
        });
    });

    // ══════════════════════════════════
    //  SUBTITLE MODE (기존 유지)
    // ══════════════════════════════════
    const subWS = document.getElementById('subWorkspace');
    let sCnt = 0;
    const sScenes = {};
    let gAccent = "#8B7355";

    // noise
    const noiseC = document.createElement('canvas');
    noiseC.width = 300; noiseC.height = 300;
    const nc = noiseC.getContext('2d');
    const nd = nc.createImageData(300,300);
    for(let i=0;i<nd.data.length;i+=4){const v=Math.random()*255;nd.data[i]=v;nd.data[i+1]=v;nd.data[i+2]=v;nd.data[i+3]=18;}
    nc.putImageData(nd,0,0);

    createSubScene();
    document.getElementById('subAdd').addEventListener('click', createSubScene);
    document.getElementById('subExportAll').addEventListener('click', subExportAll);
    document.getElementById('subExportOne').addEventListener('click', subExportOne);

    function subRedrawAll(){Object.keys(sScenes).forEach(id=>subDraw(id));}

    function createSubScene(){
        const id=sCnt++;
        sScenes[id]={img:null,imgX:0,imgY:0,scale:1,rotate:0,syncMaster:id!==0,movieTitle:'',text:id===0?'자막을 입력하십시오.':'',textY:0,fontFamily:'pretendard',fontSize:60,textColor:'#ffffff',isBold:false,isItalic:false,isOutline:true,logoStyle:'none',filmGrain:false,_drag:false};
        const card=document.createElement('div');card.className='scene-card';card.id=`sc-${id}`;
        const rm=id>0?`<button class="btn-del-scene" onclick="delSubScene(${id})">삭제</button>`:'';
        const sync=id>0?`<div class="sync-box"><label><input type="checkbox" id="ssync-${id}" checked> 1번 컷 동기화</label></div>`:'';
        card.innerHTML=`
            <div class="scene-tag">Scene ${id+1}</div>${rm}
            <div class="canvas-wrap" id="sw-${id}"><canvas id="sc-${id}-c" width="1920" height="1080"></canvas><div class="canvas-hint">드래그: 이동 · 휠: 확대/축소</div></div>
            <div class="s-panel">
                ${sync}
                <div class="section-head">배경 이미지</div>
                <div class="ctrl"><input type="file" id="sf-${id}" accept="image/*"></div>
                <div class="ctrl"><div class="ctrl-label"><span>회전</span><span id="srot-v-${id}">0°</span></div><input type="range" id="srot-${id}" min="-180" max="180" value="0"></div>
                <div class="check-row"><label><input type="checkbox" id="sgr-${id}"> 필름 그레인</label></div>
                <div class="sep"><div class="dia"></div></div>
                <div class="section-head">로고</div>
                <div class="ctrl"><select id="slogo-${id}"><option value="none">없음</option><option value="ocn">ARCH (OCN)</option><option value="netflix">A 마크</option></select></div>
                <div class="ctrl" id="ssg0-${id}"><div class="ctrl-label"><span>영화 제목</span></div><input type="text" id="stitle-${id}" placeholder="제목"></div>
                <div class="sep"><div class="dia"></div></div>
                <div class="section-head">자막</div>
                <div class="ctrl"><textarea id="stx-${id}" placeholder="자막 입력">${sScenes[id].text}</textarea></div>
                <div class="ctrl"><div class="ctrl-label"><span>세로 위치</span></div><input type="range" id="sty-${id}" min="-500" max="500" value="0"></div>
                <div class="ctrl"><div class="ctrl-label"><span>크기</span><span id="ssz-v-${id}">60px</span></div><input type="range" id="ssz-${id}" min="20" max="200" value="60"></div>
                <div class="ctrl" id="ssg1-${id}"><select id="sff-${id}"><option value="pretendard">프리텐다드</option><option value="chosun">조선 굴림체</option><option value="gulim">굴림체</option></select>
                    <div class="check-row" style="margin-top:4px;"><label><input type="checkbox" id="sb-${id}"> 볼드</label><label><input type="checkbox" id="si-${id}"> 이탤릭</label><label><input type="checkbox" id="so-${id}" checked> 테두리</label></div>
                </div>

            </div>`;
        subWS.appendChild(card);

    }

    function toggleSubSync(id){if(id===0)return;const l=sScenes[id].syncMaster;['ssg0-','ssg1-','ssg2-'].forEach(p=>{const e=document.getElementById(p+id);if(e)e.classList.toggle('locked-ui',l);});}

    function initSubEvents(id){
        const s=sScenes[id], canvas=document.getElementById(`sc-${id}-c`), wrap=document.getElementById(`sw-${id}`);
        const syncel=document.getElementById(`ssync-${id}`);

        document.getElementById(`sf-${id}`).addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{s.img=img;s.imgX=0;s.imgY=0;s.scale=1;s.rotate=0;document.getElementById(`srot-${id}`).value=0;subDraw(id);};img.src=ev.target.result;};r.readAsDataURL(f);});

        let sx,sy;

        window.addEventListener('mousemove',e=>{if(!s._drag)return;const r=canvas.getBoundingClientRect();s.imgX+=(e.clientX-sx)*(1920/r.width);s.imgY+=(e.clientY-sy)*(1080/r.height);sx=e.clientX;sy=e.clientY;subDraw(id);});

    }

    function subDraw(id){
        const s=sScenes[id],canvas=document.getElementById(`sc-${id}-c`);if(!canvas)return;
        const ctx=canvas.getContext('2d'),w=1920,h=1080;

        ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
        if(d.img){ctx.save();ctx.translate(w/2+d.imgX,h/2+d.imgY);ctx.rotate(d.rotate*Math.PI/180);const r=Math.max(w/d.img.width,h/d.img.height);ctx.scale(r*d.scale,r*d.scale);ctx.drawImage(d.img,-d.img.width/2,-d.img.height/2);ctx.restore();}
        if(d.filmGrain){ctx.save();ctx.fillStyle=ctx.createPattern(noiseC,'repeat');ctx.fillRect(0,0,w,h);ctx.restore();}
        const lh2=h*.12;ctx.fillStyle='#000';ctx.fillRect(0,0,w,lh2);ctx.fillRect(0,h-lh2,w,lh2);
        if(d.logoStyle!=='none'){ctx.save();const ly=65;if(d.logoStyle==='ocn'){const lW=125,lH=40,lX=w-lW-50;if(d.movieTitle.trim()){ctx.fillStyle='#fff';ctx.font='bold 18px "Pretendard",sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(d.movieTitle,lX+lW/2,ly-8);}ctx.fillStyle=gAccent;ctx.beginPath();ctx.roundRect(lX,ly,lW,lH,4);ctx.fill();ctx.fillStyle='#000';ctx.font='900 30px "Arial Black",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ARCH',lX+lW/2,ly+lH/2+2);}else if(d.logoStyle==='netflix'){const lX=w-70;if(d.movieTitle.trim()){ctx.fillStyle='#fff';ctx.font='bold 18px "Pretendard",sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(d.movieTitle,lX,ly-8);}ctx.fillStyle='#E50914';ctx.font='italic 900 65px "Arial Black",sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=10;ctx.fillText('A',lX,ly-5);}ctx.restore();}
        if(d.text){ctx.save();let face="'Pretendard',sans-serif";if(d.fontFamily==='chosun')face="'JoseonGulim',sans-serif";if(d.fontFamily==='gulim')face="'Gulim',굴림,sans-serif";ctx.font=`${d.isItalic?'italic ':''}${d.isBold?'bold ':''}${d.fontSize}px ${face}`;ctx.textAlign='center';ctx.textBaseline='middle';const lines=d.text.split('\n'),lineH=d.fontSize*1.3,startY=h-(h*.08)-d.textY-((lines.length-1)*lineH);lines.forEach((l,i)=>{const py=startY+i*lineH;if(d.isOutline){ctx.strokeStyle='#000';ctx.lineWidth=d.fontSize*.15;ctx.lineJoin='round';ctx.strokeText(l,w/2,py);}ctx.fillStyle=d.textColor;ctx.fillText(l,w/2,py);});ctx.restore();}
    }

    window.delSubScene=(id)=>{delete sScenes[id];const e=document.getElementById(`sc-${id}`);if(e)e.remove();};

    // ══════════════════════════════════
    //  COLLAGE MODE
    // ══════════════════════════════════
    const colCanvas = document.getElementById('colCanvas');
    const colCtx = colCanvas.getContext('2d');
    const colState = {
        images: [],
        activeIdx: -1,
        outW: 1920,
        dir: 'v',
        gridCols: 2,
        gap: 0,
        gapColor: '#000000',
        filter: 'none',
        filterStr: 1.0,
        grad: 'none',
        gradC1: '#000000',
        gradC2: '#ffffff',
        gradA: 0.4,
    };

    // refs
    const $colFileAdd = document.getElementById('colFileAdd');
    const $colStripList = document.getElementById('colStripList');
    const $colImgCtrl = document.getElementById('colImgCtrl');

    // output settings
    document.getElementById('colOutW').addEventListener('change', e => { colState.outW = Math.max(100, parseInt(e.target.value) || 1920); colDraw(); });
    document.getElementById('colDir').addEventListener('change', e => {
        colState.dir = e.target.value;
        document.getElementById('gridSettings').style.display = (e.target.value === 'grid' || e.target.value === 'gridfit') ? 'block' : 'none';
        colDraw();
    });
    document.getElementById('gridCols').addEventListener('input', e => {
        colState.gridCols = +e.target.value;
        document.getElementById('gridColsVal').textContent = e.target.value;
        colDraw();
    });
    document.getElementById('colGap').addEventListener('input', e => { colState.gap = +e.target.value; document.getElementById('colGapVal').textContent = e.target.value + 'px'; colDraw(); });
    document.getElementById('colGapColor').addEventListener('input', e => { colState.gapColor = e.target.value; colDraw(); });
    document.getElementById('colFilterStr').addEventListener('input', e => {
        colState.filterStr = +e.target.value / 100;
        document.getElementById('colFilterStrVal').textContent = e.target.value + '%';
        colDraw();
    });

    // file add
    $colFileAdd.addEventListener('change', e => {
        Array.from(e.target.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    colState.images.push({
                        img, name: file.name.length > 20 ? file.name.slice(0, 17) + '…' : file.name,
                        scale: 1, rotate: 0, ox: 0, oy: 0, thumbUrl: ev.target.result
                    });
                    colState.activeIdx = colState.images.length - 1;
                    colRenderList();
                    colDraw();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });
        e.target.value = '';
    });

    // per-image controls
    document.getElementById('ciScale').oninput = e => { if (!curImg()) return; curImg().scale = +e.target.value / 100; document.getElementById('ciScaleVal').textContent = e.target.value + '%'; colDraw(); };
    document.getElementById('ciRot').oninput = e => { if (!curImg()) return; curImg().rotate = +e.target.value; document.getElementById('ciRotVal').textContent = e.target.value + '°'; colDraw(); };
    document.getElementById('ciOX').oninput = e => { if (!curImg()) return; curImg().ox = +e.target.value; colDraw(); };
    document.getElementById('ciOY').oninput = e => { if (!curImg()) return; curImg().oy = +e.target.value; colDraw(); };

    // filters
    document.querySelectorAll('#colFilters .filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('#colFilters .filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            colState.filter = chip.dataset.f;
            colDraw();
        });
    });
    document.querySelector('#colFilters .filter-chip[data-f="none"]').classList.add('active');

    // gradient
    document.getElementById('colGrad').addEventListener('change', e => {
        colState.grad = e.target.value;
        document.getElementById('colGradCustom').style.display = e.target.value === 'custom' ? 'block' : 'none';
        colDraw();
    });
    document.getElementById('colGradC1').addEventListener('input', e => { colState.gradC1 = e.target.value; colDraw(); });
    document.getElementById('colGradC2').addEventListener('input', e => { colState.gradC2 = e.target.value; colDraw(); });
    document.getElementById('colGradA').addEventListener('input', e => { colState.gradA = +e.target.value / 100; document.getElementById('colGradAVal').textContent = e.target.value + '%'; colDraw(); });

    function curImg() { return colState.images[colState.activeIdx] || null; }

    function colRenderList() {
        const s = colState;
        if (!s.images.length) {
            $colStripList.innerHTML = '<div class="col-empty">이미지를 추가하세요</div>';
            $colImgCtrl.style.display = 'none';
            return;
        }
        $colStripList.innerHTML = '';
        s.images.forEach((item, i) => {
            const el = document.createElement('div');
            el.className = 'strip-item' + (i === s.activeIdx ? ' active' : '');
            el.innerHTML = `<img class="strip-thumb" src="${item.thumbUrl}" alt=""><span class="strip-name">${i + 1}. ${item.name}</span><button title="삭제" data-del="${i}">✕</button>`;
            el.addEventListener('click', e => {
                if (e.target.dataset.del !== undefined) { s.images.splice(+e.target.dataset.del, 1); if (s.activeIdx >= s.images.length) s.activeIdx = s.images.length - 1; colRenderList(); colDraw(); return; }
                s.activeIdx = i; colRenderList(); colSyncCtrls();
            });
            $colStripList.appendChild(el);
        });
        $colImgCtrl.style.display = s.activeIdx >= 0 ? 'block' : 'none';
        if (s.activeIdx >= 0) colSyncCtrls();
    }

    function colSyncCtrls() {
        const item = curImg(); if (!item) return;
        document.getElementById('ciScale').value = Math.round(item.scale * 100);
        document.getElementById('ciScaleVal').textContent = Math.round(item.scale * 100) + '%';
        document.getElementById('ciRot').value = item.rotate;
        document.getElementById('ciRotVal').textContent = item.rotate + '°';
        document.getElementById('ciOX').value = item.ox;
        document.getElementById('ciOY').value = item.oy;
    }

    // ── Collage Draw ──
    function colDraw() {
        const s = colState;
        if (!s.images.length) {
            colCanvas.width = 1920; colCanvas.height = 1080;
            colCtx.fillStyle = '#000'; colCtx.fillRect(0, 0, 1920, 1080);
            colCtx.fillStyle = '#333'; colCtx.font = '24px Pretendard'; colCtx.textAlign = 'center';
            colCtx.fillText('이미지를 추가하세요', 960, 540);
            return;
        }

        const outW = s.outW;
        const gap = s.gap;
        const isV = s.dir === 'v';
        const isH = s.dir === 'h';
        const isGrid = s.dir === 'grid';
        const isGridFit = s.dir === 'gridfit';

        let slots = [];
        let totalW, totalH;

        if (isGrid || isGridFit) {
            const cols = Math.max(1, Math.min(6, s.gridCols));
            const rows = Math.ceil(s.images.length / cols);
            const cellW = Math.floor((outW - gap * (cols - 1)) / cols);

            if (isGrid) {
                // Square cells, images cropped to fill
                const cellH = cellW;
                totalW = outW;
                totalH = rows * cellH + gap * (rows - 1);
                s.images.forEach((item, i) => {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    slots.push({ x: col * (cellW + gap), y: row * (cellH + gap), w: cellW, h: cellH, item, fit: false });
                });
            } else {
                // Original aspect ratio — row height = tallest image in row
                totalW = outW;
                let cy = 0;
                for (let r = 0; r < rows; r++) {
                    let rowH = 0;
                    // Find tallest cell in this row
                    for (let c = 0; c < cols; c++) {
                        const idx = r * cols + c;
                        if (idx >= s.images.length) break;
                        const item = s.images[idx];
                        const aspect = item.img.width / item.img.height;
                        const h = Math.round(cellW / aspect);
                        if (h > rowH) rowH = h;
                    }
                    // Place images in this row
                    for (let c = 0; c < cols; c++) {
                        const idx = r * cols + c;
                        if (idx >= s.images.length) break;
                        const item = s.images[idx];
                        const aspect = item.img.width / item.img.height;
                        const imgH = Math.round(cellW / aspect);
                        const yOffset = Math.round((rowH - imgH) / 2); // center vertically
                        slots.push({ x: c * (cellW + gap), y: cy + yOffset, w: cellW, h: imgH, item, fit: true });
                    }
                    cy += rowH + gap;
                }
                totalH = cy - (rows > 0 ? gap : 0);
            }
        } else if (isV) {
            // ── Vertical stack ──
            totalW = outW;
            let cy = 0;
            s.images.forEach(item => {
                const aspect = item.img.width / item.img.height;
                const slotW = outW;
                const slotH = Math.round(slotW / aspect);
                slots.push({ x: 0, y: cy, w: slotW, h: slotH, item, fit: false });
                cy += slotH + gap;
            });
            totalH = cy - (s.images.length > 0 ? gap : 0);
        } else {
            // ── Horizontal stack ──
            const totalGap = gap * (s.images.length - 1);
            const aspects = s.images.map(item => item.img.width / item.img.height);
            const sumAspect = aspects.reduce((a, b) => a + b, 0);
            const rowH = Math.round((outW - totalGap) / sumAspect);
            totalH = rowH;
            let cx = 0;
            s.images.forEach((item, i) => {
                const slotW = Math.round(rowH * aspects[i]);
                slots.push({ x: cx, y: 0, w: slotW, h: rowH, item, fit: false });
                cx += slotW + gap;
            });
            totalW = cx - (s.images.length > 0 ? gap : 0);
        }

        colCanvas.width = totalW;
        colCanvas.height = totalH;

        // Gap background
        colCtx.fillStyle = s.gapColor;
        colCtx.fillRect(0, 0, totalW, totalH);

        // Draw each image into its slot
        slots.forEach((sl, i) => {
            const item = sl.item;
            colCtx.save();
            colCtx.beginPath();
            colCtx.rect(sl.x, sl.y, sl.w, sl.h);
            colCtx.clip();

            const centerX = sl.x + sl.w / 2 + item.ox;
            const centerY = sl.y + sl.h / 2 + item.oy;
            colCtx.translate(centerX, centerY);
            colCtx.rotate(item.rotate * Math.PI / 180);

            // fit: contain (no crop) vs cover (crop to fill)
            const fitMode = sl.fit ? Math.min(sl.w / item.img.width, sl.h / item.img.height) : Math.max(sl.w / item.img.width, sl.h / item.img.height);
            const coverRatio = fitMode * item.scale;
            colCtx.scale(coverRatio, coverRatio);
            colCtx.drawImage(item.img, -item.img.width / 2, -item.img.height / 2);
            colCtx.restore();

            // Active indicator
            if (i === s.activeIdx) {
                colCtx.save();
                colCtx.strokeStyle = '#C4A87C';
                colCtx.lineWidth = 3;
                colCtx.setLineDash([8, 4]);
                colCtx.strokeRect(sl.x + 2, sl.y + 2, sl.w - 4, sl.h - 4);
                colCtx.restore();
            }
        });

        // ── Apply Filters with intensity ──
        if (s.filter !== 'none' && s.filter !== 'grain') {
            const strength = s.filterStr;
            if (strength > 0) {
                const imgData = colCtx.getImageData(0, 0, totalW, totalH);
                const px = imgData.data;
                for (let i = 0; i < px.length; i += 4) {
                    let r = px[i], g = px[i+1], b = px[i+2];
                    let nr = r, ng = g, nb = b;
                    switch (s.filter) {
                        case 'bw': { const avg = r*0.299+g*0.587+b*0.114; nr=ng=nb=avg; break; }
                        case 'sepia': { nr=Math.min(255,r*0.393+g*0.769+b*0.189); ng=Math.min(255,r*0.349+g*0.686+b*0.168); nb=Math.min(255,r*0.272+g*0.534+b*0.131); break; }
                        case 'warm': { nr=Math.min(255,r+20); nb=Math.max(0,b-15); ng=g; break; }
                        case 'cool': { nb=Math.min(255,b+20); nr=Math.max(0,r-10); ng=g; break; }
                        case 'vintage': { const a2=r*0.299+g*0.587+b*0.114; nr=Math.min(255,a2*0.5+r*0.5+20); ng=Math.min(255,a2*0.4+g*0.5+5); nb=Math.min(255,a2*0.3+b*0.4); break; }
                        case 'highcon': { nr=r>128?Math.min(255,r+30):Math.max(0,r-30); ng=g>128?Math.min(255,g+30):Math.max(0,g-30); nb=b>128?Math.min(255,b+30):Math.max(0,b-30); break; }
                    }
                    // Blend original with filtered based on strength
                    px[i]   = Math.round(r + (nr - r) * strength);
                    px[i+1] = Math.round(g + (ng - g) * strength);
                    px[i+2] = Math.round(b + (nb - b) * strength);
                }
                colCtx.putImageData(imgData, 0, 0);
            }
        }

        // Film grain (also respects intensity)
        if (s.filter === 'grain') {
            colCtx.save();
            colCtx.globalAlpha = s.filterStr;
            colCtx.fillStyle = colCtx.createPattern(noiseC, 'repeat');
            colCtx.fillRect(0, 0, totalW, totalH);
            colCtx.restore();
        }

        // Gradient overlay
        if (s.grad !== 'none') {
            colCtx.save();
            let g;
            let c1, c2;

            if (s.grad === 'custom') { c1 = s.gradC1; c2 = s.gradC2; }
            else if (s.grad.includes('black')) { c1 = 'rgba(0,0,0,1)'; c2 = 'rgba(0,0,0,0)'; }
            else if (s.grad.includes('warm')) { c1 = 'rgba(180,100,30,1)'; c2 = 'rgba(180,100,30,0)'; }
            else if (s.grad.includes('cool')) { c1 = 'rgba(30,60,180,1)'; c2 = 'rgba(30,60,180,0)'; }

            if (s.grad.startsWith('tb') || s.grad === 'custom') g = colCtx.createLinearGradient(0, 0, 0, totalH);
            else if (s.grad.startsWith('bt')) g = colCtx.createLinearGradient(0, totalH, 0, 0);
            else if (s.grad.startsWith('lr')) g = colCtx.createLinearGradient(0, 0, totalW, 0);
            else g = colCtx.createLinearGradient(0, 0, 0, totalH);

            g.addColorStop(0, c1);
            g.addColorStop(1, c2);
            colCtx.globalAlpha = s.gradA;
            colCtx.fillStyle = g;
            colCtx.fillRect(0, 0, totalW, totalH);
            colCtx.restore();
        }
    }

    // ── Collage public API ──
    window.COL = {
        move(dir) {
            const s = colState, i = s.activeIdx, j = i + dir;
            if (j < 0 || j >= s.images.length) return;
            [s.images[i], s.images[j]] = [s.images[j], s.images[i]];
            s.activeIdx = j;
            colRenderList(); colDraw();
        },
        dup() {
            const s = colState, item = curImg(); if (!item) return;
            s.images.splice(s.activeIdx + 1, 0, { ...item, img: item.img, name: item.name + ' 복사' });
            s.activeIdx++;
            colRenderList(); colDraw();
        },
        del() {
            const s = colState;
            s.images.splice(s.activeIdx, 1);
            if (s.activeIdx >= s.images.length) s.activeIdx = s.images.length - 1;
            colRenderList(); colDraw();
        },
        exportImg() {
            if (!colState.images.length) return;
            // Re-draw without active indicator
            const saved = colState.activeIdx;
            colState.activeIdx = -1;
            colDraw();
            dlC(colCanvas, 'ARCH_COLLAGE.png');
            colState.activeIdx = saved;
            colDraw();
        }
    };

    colDraw();
})();
</script>
