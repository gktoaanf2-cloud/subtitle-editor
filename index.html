<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCH CINEMA EDITOR</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'JoseonGulim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg: #E8DFD0;
            --bg-dark: #DDD4C4;
            --panel: #D9D0C1;
            --panel-inner: #E2DAC9;
            --border: #B5AA98;
            --border-light: #C8BFB0;
            --accent: #8B7355;
            --accent-gold: #C4A87C;
            --text: #3C3428;
            --text-muted: #8B7D6B;
            --text-light: #A89E8E;
            --danger: #9E4B4B;
            --canvas-bg: #1a1815;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "Pretendard Variable", Pretendard, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── NieR paper texture overlay ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Header ── */
        .site-header {
            text-align: center;
            padding: 48px 20px 32px;
            position: relative;
        }

        .header-line {
            width: 60px;
            height: 1px;
            background: var(--accent);
            margin: 0 auto 20px;
        }

        .header-diamond {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .header-diamond::before,
        .header-diamond::after {
            content: '';
            width: 40px;
            height: 1px;
            background: var(--border);
        }

        .diamond {
            width: 8px;
            height: 8px;
            background: var(--accent);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        .site-title {
            font-family: 'Noto Serif KR', serif;
            font-weight: 300;
            font-size: 1.6rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: var(--text);
        }

        .site-subtitle {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* ── Global Controls ── */
        .global-bar {
            max-width: 1440px;
            margin: 0 auto 40px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .global-bar .g-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .global-bar input[type="color"] {
            width: 32px;
            height: 22px;
            border: 1px solid var(--border);
            background: var(--panel);
            cursor: pointer;
            border-radius: 2px;
            padding: 1px;
        }

        /* ── Workspace ── */
        .workspace {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 24px 60px;
            display: flex;
            flex-direction: column;
            gap: 48px;
        }

        /* ── Scene Card (NieR panel style) ── */
        .scene-card {
            display: grid;
            grid-template-columns: 1fr 360px;
            background: var(--panel);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .scene-card::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid var(--border-light);
            pointer-events: none;
            z-index: 5;
        }

        @media (max-width: 1100px) {
            .scene-card { grid-template-columns: 1fr; }
        }

        /* scene number tag */
        .scene-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            font-family: 'Noto Serif KR', serif;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            z-index: 10;
            background: var(--panel);
            padding: 2px 8px;
            border: 1px solid var(--border-light);
        }

        /* ── Canvas Area ── */
        .canvas-wrap {
            background: var(--canvas-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: grab;
            overflow: hidden;
            min-height: 420px;
        }
        .canvas-wrap:active { cursor: grabbing; }
        .canvas-wrap canvas { width: 100%; height: auto; display: block; }

        .canvas-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
            z-index: 6;
            white-space: nowrap;
        }

        /* ── Panel (Controls Sidebar) ── */
        .panel {
            padding: 24px;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 700px;
            overflow-y: auto;
            background: var(--panel);
        }

        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .panel::-webkit-scrollbar-track { background: transparent; }

        /* ── Section Headers ── */
        .section-head {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .section-head::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        /* ── Form Controls ── */
        .ctrl { display: flex; flex-direction: column; gap: 6px; }

        .ctrl-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: var(--border);
            outline: none;
            border-radius: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border: 2px solid var(--bg);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 8px 10px;
            background: var(--panel-inner);
            border: 1px solid var(--border-light);
            color: var(--text);
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }
        textarea { height: 68px; resize: none; }
        select { cursor: pointer; }

        input[type="file"] {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        input[type="file"]::file-selector-button {
            background: var(--panel-inner);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 4px 12px;
            font-size: 0.72rem;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            margin-right: 8px;
            transition: background 0.15s;
        }
        input[type="file"]::file-selector-button:hover {
            background: var(--border-light);
        }

        .check-row {
            display: flex;
            gap: 14px;
            font-size: 0.78rem;
            flex-wrap: wrap;
            color: var(--text);
        }
        .check-row label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            accent-color: var(--accent);
        }

        .color-pick {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-pick input[type="color"] {
            width: 36px;
            height: 24px;
            border: 1px solid var(--border);
            background: var(--panel-inner);
            cursor: pointer;
            padding: 1px;
        }

        /* ── Sync Box ── */
        .sync-box {
            background: rgba(139, 115, 85, 0.1);
            border: 1px solid rgba(139, 115, 85, 0.3);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
        }

        .locked-ui { opacity: 0.35; pointer-events: none; }

        /* ── Layer List ── */
        .layer-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: var(--panel-inner);
            border: 1px solid transparent;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.1s;
        }
        .layer-item:hover { border-color: var(--border); }
        .layer-item.active {
            border-color: var(--accent);
            background: rgba(139, 115, 85, 0.12);
        }

        .layer-item .l-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .layer-item button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 2px 4px;
            line-height: 1;
        }
        .layer-item button:hover { color: var(--danger); }

        .layer-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 0.7rem;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--panel-inner);
            color: var(--text);
            transition: all 0.15s;
        }
        .btn-sm:hover { background: var(--border-light); }

        /* ── Separator ── */
        .sep {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 4px 0;
        }
        .sep::before, .sep::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }
        .sep .diamond {
            width: 5px;
            height: 5px;
        }

        /* ── Footer Buttons ── */
        .footer-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 0 24px 80px;
            max-width: 1440px;
            margin: 0 auto;
        }

        .btn {
            padding: 12px 36px;
            font-family: 'Noto Serif KR', serif;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
        }
        .btn:hover {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--text);
            border-color: var(--text);
        }

        .btn-remove-scene {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            background: var(--panel);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 3px 10px;
            font-size: 0.65rem;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-remove-scene:hover {
            background: var(--danger);
            color: #fff;
        }

        /* ── Mode Tabs ── */
        .mode-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
        }
        .mode-tab {
            flex: 1;
            padding: 7px 0;
            text-align: center;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: inherit;
        }
        .mode-tab:hover { color: var(--text); }
        .mode-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; gap: 16px; }

        /* ── Opacity Slider for Layers ── */
        .layer-opacity {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .layer-opacity input[type="range"] { flex: 1; }
        .layer-opacity span { font-size: 0.68rem; color: var(--text-muted); width: 32px; text-align: right; }

    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-line"></div>
        <div class="header-diamond">
            <div class="diamond"></div>
        </div>
        <h1 class="site-title">Arch Cinema</h1>
        <p class="site-subtitle">Scene Composition Editor</p>
    </header>

    <!-- Global Bar -->
    <div class="global-bar">
        <div class="g-item">
            <span>Point Color</span>
            <input type="color" id="globalAccent" value="#8B7355">
        </div>
        <div class="g-item">
            <span>Canvas</span>
            <select id="globalRatio" style="padding:3px 6px; background:var(--panel-inner); border:1px solid var(--border); color:var(--text); font-size:0.72rem; font-family:inherit;">
                <option value="1920x1080">1920 × 1080</option>
                <option value="1080x1080">1080 × 1080</option>
                <option value="1080x1350">1080 × 1350</option>
                <option value="1080x1920">1080 × 1920</option>
            </select>
        </div>
    </div>

    <!-- Workspace -->
    <div id="workspace" class="workspace"></div>

    <!-- Footer -->
    <div class="footer-actions">
        <button class="btn" id="addScene">＋ 컷 추가</button>
        <button class="btn btn-primary" id="exportAll">렌더링 저장</button>
        <button class="btn" id="exportSingle">현재 컷만 저장</button>
    </div>

    <script>
    (() => {
        const workspace = document.getElementById('workspace');
        let sceneCounter = 0;
        const scenes = {};
        let globalAccent = "#8B7355";
        let canvasW = 1920, canvasH = 1080;

        // Film grain pre-render
        const noiseCanvas = document.createElement('canvas');
        noiseCanvas.width = 300; noiseCanvas.height = 300;
        const nctx = noiseCanvas.getContext('2d');
        const nImg = nctx.createImageData(300, 300);
        for (let i = 0; i < nImg.data.length; i += 4) {
            const v = Math.random() * 255;
            nImg.data[i] = v; nImg.data[i+1] = v; nImg.data[i+2] = v;
            nImg.data[i+3] = 18;
        }
        nctx.putImageData(nImg, 0, 0);

        // ── Init ──
        createScene();

        document.getElementById('addScene').addEventListener('click', createScene);
        document.getElementById('exportAll').addEventListener('click', exportAll);
        document.getElementById('exportSingle').addEventListener('click', exportSingle);

        document.getElementById('globalAccent').addEventListener('input', e => {
            globalAccent = e.target.value;
            redrawAll();
        });

        document.getElementById('globalRatio').addEventListener('change', e => {
            const [w, h] = e.target.value.split('x').map(Number);
            canvasW = w; canvasH = h;
            Object.keys(scenes).forEach(id => {
                const c = document.getElementById(`canvas-${id}`);
                if (c) { c.width = canvasW; c.height = canvasH; }
            });
            redrawAll();
        });

        function redrawAll() { Object.keys(scenes).forEach(id => draw(id)); }

        function createScene() {
            const id = sceneCounter++;
            scenes[id] = {
                layers: [],          // collage layers: { img, x, y, scale, rotate, opacity, name }
                activeLayer: -1,     // selected layer index
                syncMaster: id !== 0,
                movieTitle: "",
                text: id === 0 ? "자막을 입력하십시오." : "",
                textY: 0,
                fontFamily: 'pretendard',
                fontSize: 60,
                textColor: "#ffffff",
                isBold: false, isItalic: false, isOutline: true,
                logoStyle: 'none',
                filmGrain: false,
                _dragging: false
            };

            const card = document.createElement('div');
            card.className = 'scene-card';
            card.id = `card-${id}`;

            const removeBtn = id > 0 ? `<button class="btn-remove-scene" onclick="deleteScene(${id})">삭제</button>` : '';
            const syncUI = id > 0 ? `
                <div class="sync-box">
                    <label><input type="checkbox" id="sync-${id}" checked> 1번 컷 스타일 동기화</label>
                </div>` : '';

            card.innerHTML = `
                <div class="scene-tag">Scene ${id + 1}</div>
                ${removeBtn}
                <div class="canvas-wrap" id="wrap-${id}">
                    <canvas id="canvas-${id}" width="${canvasW}" height="${canvasH}"></canvas>
                    <div class="canvas-hint">드래그: 이동 · 휠: 확대/축소 · Shift+휠: 회전</div>
                </div>
                <div class="panel" id="panel-${id}">
                    ${syncUI}

                    <div class="mode-tabs">
                        <button class="mode-tab active" data-tab="layers" data-id="${id}">레이어</button>
                        <button class="mode-tab" data-tab="subtitle" data-id="${id}">자막</button>
                        <button class="mode-tab" data-tab="style" data-id="${id}">스타일</button>
                    </div>

                    <!-- TAB: Layers (Collage) -->
                    <div class="tab-content active" id="tab-layers-${id}">
                        <div class="section-head">이미지 레이어</div>
                        <input type="file" id="fileAdd-${id}" accept="image/*" multiple>
                        <div class="layer-list" id="layerList-${id}"></div>

                        <div id="layerCtrl-${id}" style="display:none;">
                            <div class="sep"><div class="diamond"></div></div>
                            <div class="ctrl" style="margin-top:8px;">
                                <div class="ctrl-label"><span>회전</span><span id="lrot-val-${id}">0°</span></div>
                                <input type="range" id="lrot-${id}" min="-180" max="180" value="0">
                            </div>
                            <div class="ctrl" style="margin-top:8px;">
                                <div class="ctrl-label"><span>크기</span><span id="lscale-val-${id}">100%</span></div>
                                <input type="range" id="lscale-${id}" min="5" max="500" value="100">
                            </div>
                            <div class="ctrl" style="margin-top:8px;">
                                <div class="layer-opacity">
                                    <span style="width:auto;">불투명도</span>
                                    <input type="range" id="lopacity-${id}" min="0" max="100" value="100">
                                    <span id="lopacity-val-${id}">100%</span>
                                </div>
                            </div>
                            <div class="layer-actions" style="margin-top:6px;">
                                <button class="btn-sm" onclick="moveLayer(${id},-1)">▲ 위로</button>
                                <button class="btn-sm" onclick="moveLayer(${id},1)">▼ 아래로</button>
                                <button class="btn-sm" onclick="duplicateLayer(${id})">복제</button>
                                <button class="btn-sm" onclick="removeLayer(${id})" style="color:var(--danger);">삭제</button>
                            </div>
                        </div>
                    </div>

                    <!-- TAB: Subtitle -->
                    <div class="tab-content" id="tab-subtitle-${id}">
                        <div class="section-head">자막 텍스트</div>
                        <div class="ctrl">
                            <textarea id="text-${id}" placeholder="자막을 입력하십시오.">${scenes[id].text}</textarea>
                        </div>
                        <div class="ctrl">
                            <div class="ctrl-label"><span>세로 위치</span></div>
                            <input type="range" id="textY-${id}" min="-500" max="500" value="0">
                        </div>
                        <div class="ctrl">
                            <div class="ctrl-label"><span>크기</span><span id="size-val-${id}">60px</span></div>
                            <input type="range" id="size-${id}" min="20" max="200" value="60">
                        </div>

                        <div class="sep"><div class="diamond"></div></div>

                        <div class="section-head" id="syncGroup1-${id}">서체 설정</div>
                        <div class="ctrl" id="syncGroup2-${id}">
                            <select id="fontFamily-${id}">
                                <option value="pretendard">프리텐다드</option>
                                <option value="chosun">조선 굴림체</option>
                                <option value="gulim">굴림체</option>
                            </select>
                            <div class="check-row" style="margin-top:6px;">
                                <label><input type="checkbox" id="bold-${id}"> 볼드</label>
                                <label><input type="checkbox" id="italic-${id}"> 이탤릭</label>
                                <label><input type="checkbox" id="outline-${id}" checked> 테두리</label>
                            </div>
                        </div>
                        <div class="ctrl" id="syncGroup3-${id}">
                            <div class="color-pick">
                                <span class="ctrl-label" style="margin:0;">자막 색상</span>
                                <input type="color" id="color-${id}" value="#ffffff">
                            </div>
                        </div>
                    </div>

                    <!-- TAB: Style -->
                    <div class="tab-content" id="tab-style-${id}">
                        <div class="section-head">로고</div>
                        <div class="ctrl">
                            <select id="logoStyle-${id}">
                                <option value="none">없음</option>
                                <option value="ocn">ARCH (OCN 오마주)</option>
                                <option value="netflix">A 마크 (넷플릭스 오마주)</option>
                            </select>
                        </div>
                        <div class="ctrl" id="syncGroupTitle-${id}">
                            <div class="ctrl-label"><span>영화 제목</span></div>
                            <input type="text" id="movieTitle-${id}" placeholder="로고 위에 표시할 제목">
                        </div>

                        <div class="sep"><div class="diamond"></div></div>

                        <div class="section-head">효과</div>
                        <div class="check-row">
                            <label><input type="checkbox" id="grain-${id}"> 필름 그레인</label>
                        </div>
                    </div>
                </div>
            `;

            workspace.appendChild(card);
            initEvents(id);
            toggleSyncUI(id);
            draw(id);
        }

        function toggleSyncUI(id) {
            if (id === 0) return;
            const locked = scenes[id].syncMaster;
            ['syncGroup1-', 'syncGroup2-', 'syncGroup3-', 'syncGroupTitle-'].forEach(prefix => {
                const el = document.getElementById(prefix + id);
                if (el) el.classList.toggle('locked-ui', locked);
            });
        }

        function initEvents(id) {
            const s = scenes[id];
            const canvas = document.getElementById(`canvas-${id}`);
            const wrap = document.getElementById(`wrap-${id}`);

            // Tab switching
            document.querySelectorAll(`#panel-${id} .mode-tab`).forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll(`#panel-${id} .mode-tab`).forEach(t => t.classList.remove('active'));
                    document.querySelectorAll(`#panel-${id} .tab-content`).forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`tab-${tab.dataset.tab}-${id}`).classList.add('active');
                });
            });

            // Sync
            const syncEl = document.getElementById(`sync-${id}`);
            if (syncEl) {
                syncEl.addEventListener('change', e => {
                    s.syncMaster = e.target.checked;
                    toggleSyncUI(id);
                    draw(id);
                });
            }

            // File add (multiple images → layers)
            document.getElementById(`fileAdd-${id}`).addEventListener('change', e => {
                Array.from(e.target.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const img = new Image();
                        img.onload = () => {
                            s.layers.push({
                                img, x: 0, y: 0, scale: 1, rotate: 0, opacity: 1,
                                name: file.name.length > 18 ? file.name.slice(0, 15) + '…' : file.name
                            });
                            s.activeLayer = s.layers.length - 1;
                            renderLayerList(id);
                            draw(id);
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            });

            // Layer controls
            document.getElementById(`lrot-${id}`).oninput = e => {
                if (s.activeLayer < 0 || !s.layers[s.activeLayer]) return;
                s.layers[s.activeLayer].rotate = parseInt(e.target.value);
                document.getElementById(`lrot-val-${id}`).textContent = e.target.value + '°';
                draw(id);
            };
            document.getElementById(`lscale-${id}`).oninput = e => {
                if (s.activeLayer < 0 || !s.layers[s.activeLayer]) return;
                s.layers[s.activeLayer].scale = parseInt(e.target.value) / 100;
                document.getElementById(`lscale-val-${id}`).textContent = e.target.value + '%';
                draw(id);
            };
            document.getElementById(`lopacity-${id}`).oninput = e => {
                if (s.activeLayer < 0 || !s.layers[s.activeLayer]) return;
                s.layers[s.activeLayer].opacity = parseInt(e.target.value) / 100;
                document.getElementById(`lopacity-val-${id}`).textContent = e.target.value + '%';
                draw(id);
            };

            // Subtitle controls
            document.getElementById(`text-${id}`).oninput = e => { s.text = e.target.value; draw(id); };
            document.getElementById(`textY-${id}`).oninput = e => { s.textY = parseInt(e.target.value); draw(id); };
            document.getElementById(`size-${id}`).oninput = e => {
                s.fontSize = parseInt(e.target.value);
                document.getElementById(`size-val-${id}`).textContent = s.fontSize + 'px';
                draw(id);
            };

            const syncUpdate = () => id === 0 ? redrawAll() : draw(id);
            document.getElementById(`movieTitle-${id}`).oninput = e => { s.movieTitle = e.target.value; syncUpdate(); };
            document.getElementById(`color-${id}`).onchange = e => { s.textColor = e.target.value; syncUpdate(); };
            document.getElementById(`fontFamily-${id}`).onchange = e => { s.fontFamily = e.target.value; syncUpdate(); };
            document.getElementById(`bold-${id}`).onchange = e => { s.isBold = e.target.checked; syncUpdate(); };
            document.getElementById(`italic-${id}`).onchange = e => { s.isItalic = e.target.checked; syncUpdate(); };
            document.getElementById(`outline-${id}`).onchange = e => { s.isOutline = e.target.checked; syncUpdate(); };

            document.getElementById(`logoStyle-${id}`).onchange = e => { s.logoStyle = e.target.value; redrawAll(); };
            document.getElementById(`grain-${id}`).onchange = e => { s.filmGrain = e.target.checked; draw(id); };

            // Canvas interactions: drag selected layer
            let startX, startY;
            wrap.addEventListener('mousedown', e => {
                if (s.activeLayer < 0 || !s.layers[s.activeLayer]) return;
                s._dragging = true;
                startX = e.clientX; startY = e.clientY;
            });
            window.addEventListener('mousemove', e => {
                if (!s._dragging) return;
                const layer = s.layers[s.activeLayer];
                if (!layer) return;
                const rect = canvas.getBoundingClientRect();
                const rx = canvas.width / rect.width;
                const ry = canvas.height / rect.height;
                layer.x += (e.clientX - startX) * rx;
                layer.y += (e.clientY - startY) * ry;
                startX = e.clientX; startY = e.clientY;
                draw(id);
            });
            window.addEventListener('mouseup', () => { s._dragging = false; });

            // Touch support
            wrap.addEventListener('touchstart', e => {
                if (s.activeLayer < 0 || !s.layers[s.activeLayer]) return;
                s._dragging = true;
                const t = e.touches[0];
                startX = t.clientX; startY = t.clientY;
            }, { passive: true });
            window.addEventListener('touchmove', e => {
                if (!s._dragging) return;
                const layer = s.layers[s.activeLayer];
                if (!layer) return;
                const t = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const rx = canvas.width / rect.width;
                const ry = canvas.height / rect.height;
                layer.x += (t.clientX - startX) * rx;
                layer.y += (t.clientY - startY) * ry;
                startX = t.clientX; startY = t.clientY;
                draw(id);
            }, { passive: true });
            window.addEventListener('touchend', () => { s._dragging = false; });

            // Wheel: scale or rotate
            wrap.addEventListener('wheel', e => {
                e.preventDefault();
                if (s.activeLayer < 0 || !s.layers[s.activeLayer]) return;
                const layer = s.layers[s.activeLayer];
                if (e.shiftKey) {
                    layer.rotate += e.deltaY > 0 ? 2 : -2;
                    layer.rotate = Math.max(-180, Math.min(180, layer.rotate));
                    document.getElementById(`lrot-${id}`).value = layer.rotate;
                    document.getElementById(`lrot-val-${id}`).textContent = layer.rotate + '°';
                } else {
                    layer.scale -= e.deltaY * 0.001;
                    layer.scale = Math.max(0.05, Math.min(5, layer.scale));
                    document.getElementById(`lscale-${id}`).value = Math.round(layer.scale * 100);
                    document.getElementById(`lscale-val-${id}`).textContent = Math.round(layer.scale * 100) + '%';
                }
                draw(id);
            }, { passive: false });
        }

        // ── Layer List UI ──
        function renderLayerList(id) {
            const s = scenes[id];
            const list = document.getElementById(`layerList-${id}`);
            const ctrl = document.getElementById(`layerCtrl-${id}`);
            list.innerHTML = '';

            if (s.layers.length === 0) {
                list.innerHTML = '<div style="font-size:0.72rem; color:var(--text-light); text-align:center; padding:12px 0;">이미지를 추가하세요</div>';
                ctrl.style.display = 'none';
                return;
            }

            s.layers.forEach((layer, i) => {
                const item = document.createElement('div');
                item.className = 'layer-item' + (i === s.activeLayer ? ' active' : '');
                item.innerHTML = `
                    <span class="l-name">${i + 1}. ${layer.name}</span>
                    <button title="삭제" onclick="event.stopPropagation(); removeLayerAt(${id},${i})">✕</button>
                `;
                item.addEventListener('click', () => {
                    s.activeLayer = i;
                    renderLayerList(id);
                    syncLayerControls(id);
                    draw(id);
                });
                list.appendChild(item);
            });

            ctrl.style.display = s.activeLayer >= 0 ? 'block' : 'none';
            if (s.activeLayer >= 0) syncLayerControls(id);
        }

        function syncLayerControls(id) {
            const s = scenes[id];
            const layer = s.layers[s.activeLayer];
            if (!layer) return;
            document.getElementById(`lrot-${id}`).value = layer.rotate;
            document.getElementById(`lrot-val-${id}`).textContent = layer.rotate + '°';
            document.getElementById(`lscale-${id}`).value = Math.round(layer.scale * 100);
            document.getElementById(`lscale-val-${id}`).textContent = Math.round(layer.scale * 100) + '%';
            document.getElementById(`lopacity-${id}`).value = Math.round(layer.opacity * 100);
            document.getElementById(`lopacity-val-${id}`).textContent = Math.round(layer.opacity * 100) + '%';
        }

        // Global layer operations
        window.moveLayer = (id, dir) => {
            const s = scenes[id];
            const i = s.activeLayer;
            const j = i + dir;
            if (j < 0 || j >= s.layers.length) return;
            [s.layers[i], s.layers[j]] = [s.layers[j], s.layers[i]];
            s.activeLayer = j;
            renderLayerList(id);
            draw(id);
        };

        window.duplicateLayer = (id) => {
            const s = scenes[id];
            const layer = s.layers[s.activeLayer];
            if (!layer) return;
            s.layers.splice(s.activeLayer + 1, 0, { ...layer, x: layer.x + 30, y: layer.y + 30, name: layer.name + ' 복사' });
            s.activeLayer = s.activeLayer + 1;
            renderLayerList(id);
            draw(id);
        };

        window.removeLayer = (id) => {
            const s = scenes[id];
            s.layers.splice(s.activeLayer, 1);
            s.activeLayer = Math.min(s.activeLayer, s.layers.length - 1);
            renderLayerList(id);
            draw(id);
        };

        window.removeLayerAt = (id, i) => {
            const s = scenes[id];
            s.layers.splice(i, 1);
            if (s.activeLayer >= s.layers.length) s.activeLayer = s.layers.length - 1;
            renderLayerList(id);
            draw(id);
        };

        // ── Draw ──
        function draw(id) {
            const s = scenes[id];
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;

            let ds = { ...s };
            if (s.syncMaster && id !== 0 && scenes[0]) {
                ds.movieTitle = scenes[0].movieTitle;
                ds.fontFamily = scenes[0].fontFamily;
                ds.textColor = scenes[0].textColor;
                ds.isBold = scenes[0].isBold;
                ds.isItalic = scenes[0].isItalic;
                ds.isOutline = scenes[0].isOutline;
            }

            // Background
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, w, h);

            // Draw all layers (collage)
            s.layers.forEach((layer, i) => {
                ctx.save();
                ctx.globalAlpha = layer.opacity;
                ctx.translate(w / 2 + layer.x, h / 2 + layer.y);
                ctx.rotate(layer.rotate * Math.PI / 180);
                const ratio = Math.max(w / layer.img.width, h / layer.img.height);
                ctx.scale(ratio * layer.scale, ratio * layer.scale);
                ctx.drawImage(layer.img, -layer.img.width / 2, -layer.img.height / 2);
                ctx.restore();

                // Active layer border indicator (subtle)
                if (i === s.activeLayer && s.layers.length > 1) {
                    ctx.save();
                    ctx.strokeStyle = globalAccent;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    const cX = w / 2 + layer.x, cY = h / 2 + layer.y;
                    const bw = 120, bh = 80;
                    ctx.strokeRect(cX - bw / 2, cY - bh / 2, bw, bh);
                    ctx.restore();
                }
            });

            // Film grain
            if (ds.filmGrain) {
                ctx.save();
                ctx.fillStyle = ctx.createPattern(noiseCanvas, 'repeat');
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }

            // Letterbox
            const lh = h * 0.12;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, w, lh);
            ctx.fillRect(0, h - lh, w, lh);

            // Logo
            if (ds.logoStyle !== 'none') {
                ctx.save();
                const logoY = 65;
                if (ds.logoStyle === 'ocn') {
                    const lW = 125, lH = 40, lX = w - lW - 50;
                    if (ds.movieTitle.trim()) {
                        ctx.fillStyle = "#fff";
                        ctx.font = 'bold 18px "Pretendard", sans-serif';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                        ctx.fillText(ds.movieTitle, lX + lW / 2, logoY - 8);
                    }
                    ctx.fillStyle = globalAccent;
                    ctx.beginPath(); ctx.roundRect(lX, logoY, lW, lH, 4); ctx.fill();
                    ctx.fillStyle = "#000";
                    ctx.font = '900 30px "Arial Black", sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('ARCH', lX + lW / 2, logoY + lH / 2 + 2);
                } else if (ds.logoStyle === 'netflix') {
                    const lX = w - 70;
                    if (ds.movieTitle.trim()) {
                        ctx.fillStyle = "#fff";
                        ctx.font = 'bold 18px "Pretendard", sans-serif';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                        ctx.fillText(ds.movieTitle, lX, logoY - 8);
                    }
                    ctx.fillStyle = "#E50914";
                    ctx.font = 'italic 900 65px "Arial Black", sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                    ctx.shadowColor = "rgba(0,0,0,0.8)";
                    ctx.shadowBlur = 10;
                    ctx.fillText('A', lX, logoY - 5);
                }
                ctx.restore();
            }

            // Subtitle
            if (ds.text) {
                ctx.save();
                let face = "'Pretendard', sans-serif";
                if (ds.fontFamily === 'chosun') face = "'JoseonGulim', sans-serif";
                if (ds.fontFamily === 'gulim') face = "'Gulim', 굴림, sans-serif";

                ctx.font = `${ds.isItalic ? 'italic ' : ''}${ds.isBold ? 'bold ' : ''}${ds.fontSize}px ${face}`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                const lines = ds.text.split('\n');
                const lineH = ds.fontSize * 1.3;
                const startY = h - (h * 0.08) - ds.textY - ((lines.length - 1) * lineH);

                lines.forEach((line, i) => {
                    const py = startY + i * lineH;
                    if (ds.isOutline) {
                        ctx.strokeStyle = "#000";
                        ctx.lineWidth = ds.fontSize * 0.15;
                        ctx.lineJoin = "round";
                        ctx.strokeText(line, w / 2, py);
                    }
                    ctx.fillStyle = ds.textColor;
                    ctx.fillText(line, w / 2, py);
                });
                ctx.restore();
            }
        }

        window.deleteScene = (id) => {
            delete scenes[id];
            const el = document.getElementById(`card-${id}`);
            if (el) el.remove();
        };

        function exportAll() {
            const ids = Object.keys(scenes).sort((a, b) => a - b);
            if (!ids.length) return;
            const master = document.createElement('canvas');
            master.width = canvasW;
            master.height = canvasH * ids.length;
            const mctx = master.getContext('2d');
            ids.forEach((id, i) => {
                mctx.drawImage(document.getElementById(`canvas-${id}`), 0, i * canvasH);
            });
            dl(master, 'ARCH_CINEMA_ALL.png');
        }

        function exportSingle() {
            // Export the first scene or last interacted
            const ids = Object.keys(scenes);
            if (!ids.length) return;
            dl(document.getElementById(`canvas-${ids[ids.length - 1]}`), `ARCH_CINEMA_SCENE_${ids[ids.length - 1]}.png`);
        }

        function dl(canvas, name) {
            const link = document.createElement('a');
            link.download = name;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    })();
    </script>
</body>
</html>
