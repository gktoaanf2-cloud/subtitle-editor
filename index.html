<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCH CINEMA EDITOR</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <style>
        /* 보스께서 제공해주신 조선 굴림체 웹폰트 엔진 이식 */
        @font-face {
            font-family: 'JoseonGulim';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        :root {
            --bg-base: #0a0a0a;
            --bg-panel: #161616;
            --border-color: #2a2a2a;
            --accent: #f47b20; /* 실시간으로 변경될 포인트 컬러 변수 */
            --text-main: #f0f0f0;
            --text-muted: #777777;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: "Pretendard Variable", Pretendard, sans-serif;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 20px;
            color: #fff;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            transition: border-color 0.2s;
        }

        /* 글로벌 컬러 컨트롤러 패널 */
        .global-settings-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 12px 25px;
            border-radius: 8px;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .global-settings-panel input[type="color"] {
            width: 45px;
            height: 28px;
            border: 1px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            padding: 0;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 50px;
            width: 100%;
            max-width: 1400px;
        }

        /* 씬 블록 */
        .scene-card {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 0;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        @media (max-width: 1100px) {
            .scene-card { grid-template-columns: 1fr; }
        }

        .canvas-container {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: grab;
            overflow: hidden;
        }

        .canvas-container:active { cursor: grabbing; }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .panel {
            padding: 30px;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-height: 700px;
            overflow-y: auto;
        }
        
        .panel::-webkit-scrollbar { width: 6px; }
        .panel::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        input[type="file"], input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }
        
        textarea {
            height: 80px;
            resize: none;
        }

        input[type="file"]::file-selector-button {
            background: #333;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { background: #e0e0e0; }
        
        .btn-add { background: transparent; border: 1px solid var(--text-muted); color: var(--text-main); }
        .btn-add:hover { background: rgba(255,255,255,0.1); }

        .btn-export { background: var(--accent); color: #fff; border: none; }
        .btn-export:hover { background: #e66a15; }

        .btn-remove {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,0,0,0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 10;
        }
        .btn-remove:hover { background: #ff4444; color: #fff; }

        .info-msg {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header-title">ARCH CINEMA EDITOR</div>
    
    <div class="global-settings-panel">
        <span>🎨 GLOBAL POINT & LOGO COLOR WHEEL :</span>
        <input type="color" id="globalAccent" value="#f47b20">
    </div>
    
    <div id="workspace" class="workspace"></div>

    <div class="btn-group">
        <button class="btn btn-add" id="addScene">＋ 추가 컷 생성</button>
        <button class="btn btn-export" id="exportAll">💾 고화질 렌더링 다운로드</button>
    </div>

    <script>
        const workspace = document.getElementById('workspace');
        let sceneCounter = 0;
        const scenes = {};
        let globalAccentColor = "#f47b20"; // 마스터 컬러 초기값

        // 초기 생성
        createScene();

        document.getElementById('addScene').addEventListener('click', createScene);
        document.getElementById('exportAll').addEventListener('click', exportImages);
        
        // 글로벌 색상휠 작동 로직
        document.getElementById('globalAccent').addEventListener('input', (e) => {
            globalAccentColor = e.target.value;
            document.documentElement.style.setProperty('--accent', globalAccentColor);
            // 실시간 컬러 반영을 위해 가동 중인 모든 캔버스 동시 리렌더링
            Object.keys(scenes).forEach(id => draw(id));
        });

        function createScene() {
            const id = sceneCounter++;
            scenes[id] = {
                img: null,
                imgX: 0, imgY: 0, scale: 1, rotate: 0,
                movieTitle: "", // 영화 제목 상태 필드
                text: "자막을 입력하십시오.",
                textY: 0, 
                fontFamily: 'pretendard', 
                fontSize: 60,
                textColor: "#ffffff",
                isBold: false, isItalic: false, isOutline: true,
                showLogo: false,
                isDraggingImg: false
            };

            const card = document.createElement('div');
            card.className = 'scene-card';
            card.id = `card-${id}`;
            
            const removeBtnHtml = id > 0 ? `<button class="btn-remove" onclick="deleteScene(${id})">삭제</button>` : '';

            card.innerHTML = `
                ${removeBtnHtml}
                <div class="canvas-container" id="wrap-${id}">
                    <div class="info-msg">배경: 드래그 이동 / 마우스 휠 확대·축소</div>
                    <canvas id="canvas-${id}" width="1920" height="1080"></canvas>
                </div>
                <div class="panel">
                    
                    <div class="control-group">
                        <div class="label-row"><span>Background Image</span></div>
                        <input type="file" id="file-${id}" accept="image/*">
                        
                        <div class="label-row" style="margin-top:10px;"><span>Rotation</span> <span id="rot-val-${id}">0°</span></div>
                        <input type="range" id="rotate-${id}" min="-180" max="180" value="0">
                        
                        <div class="checkbox-group" style="margin-top:10px;">
                            <label><input type="checkbox" id="logo-${id}"> <b>ARCH 로고 및 영화제목 활성화</b></label>
                        </div>
                    </div>

                    <div class="control-group">
                        <div class="label-row"><span>Movie Title (로고 위 표시)</span></div>
                        <input type="text" id="movieTitle-${id}" placeholder="영화 제목을 직접 작성하십시오.">
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 5px 0;">

                    <div class="control-group">
                        <div class="label-row"><span>Subtitle Text</span></div>
                        <textarea id="text-${id}">자막을 입력하십시오.</textarea>
                    </div>

                    <div class="control-group">
                        <div class="label-row"><span>Font Settings</span></div>
                        <select id="fontFamily-${id}">
                            <option value="pretendard">프리텐다드 (Pretendard)</option>
                            <option value="chosun">조선 굴림체 (JoseonGulim)</option>
                            <option value="gulim">일반 굴림체 (Gulim)</option>
                        </select>
                        <div class="checkbox-group" style="margin-top:5px;">
                            <label><input type="checkbox" id="bold-${id}"> 볼드</label>
                            <label><input type="checkbox" id="italic-${id}"> 이텔릭</label>
                            <label><input type="checkbox" id="outline-${id}" checked> 아웃라인(테두리)</label>
                        </div>
                    </div>

                    <div class="control-group">
                        <div class="label-row"><span>Font Size</span> <span id="size-val-${id}">60px</span></div>
                        <input type="range" id="size-${id}" min="20" max="200" value="60">
                        
                        <div class="label-row" style="margin-top:10px;"><span>Text Vertical Position (상하 위치)</span></div>
                        <input type="range" id="textY-${id}" min="-500" max="500" value="0">
                        
                        <div class="label-row" style="margin-top:10px; align-items:center;">
                            <span>Text Color</span>
                            <input type="color" id="color-${id}" value="#ffffff" style="width:50px; padding:0; height:30px; border:none; cursor:pointer;">
                        </div>
                    </div>

                </div>
            `;
            workspace.appendChild(card);
            initEvents(id);
            draw(id);
        }

        function initEvents(id) {
            const s = scenes[id];
            const canvas = document.getElementById(`canvas-${id}`);
            const wrap = document.getElementById(`wrap-${id}`);

            document.getElementById(`file-${id}`).addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = event => {
                    const img = new Image();
                    img.onload = () => { 
                        s.img = img; 
                        s.imgX = 0; s.imgY = 0; s.scale = 1; s.rotate = 0;
                        document.getElementById(`rotate-${id}`).value = 0;
                        draw(id); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            document.getElementById(`rotate-${id}`).oninput = e => { s.rotate = parseInt(e.target.value); document.getElementById(`rot-val-${id}`).innerText = s.rotate + "°"; draw(id); };
            document.getElementById(`logo-${id}`).onchange = e => { s.showLogo = e.target.checked; draw(id); };
            document.getElementById(`movieTitle-${id}`).oninput = e => { s.movieTitle = e.target.value; draw(id); };
            
            document.getElementById(`text-${id}`).oninput = e => { s.text = e.target.value; draw(id); };
            document.getElementById(`textY-${id}`).oninput = e => { s.textY = parseInt(e.target.value); draw(id); };
            document.getElementById(`size-${id}`).oninput = e => { s.fontSize = parseInt(e.target.value); document.getElementById(`size-val-${id}`).innerText = s.fontSize + "px"; draw(id); };
            document.getElementById(`color-${id}`).onchange = e => { s.textColor = e.target.value; draw(id); };
            document.getElementById(`fontFamily-${id}`).onchange = e => { s.fontFamily = e.target.value; draw(id); };
            
            document.getElementById(`bold-${id}`).onchange = e => { s.isBold = e.target.checked; draw(id); };
            document.getElementById(`italic-${id}`).onchange = e => { s.isItalic = e.target.checked; draw(id); };
            document.getElementById(`outline-${id}`).onchange = e => { s.isOutline = e.target.checked; draw(id); };

            wrap.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomIntensity = 0.001;
                s.scale -= e.deltaY * zoomIntensity;
                if(s.scale < 0.1) s.scale = 0.1;
                if(s.scale > 10) s.scale = 10;
                draw(id);
            }, { passive: false });

            let startX, startY;
            wrap.onmousedown = e => {
                if(!s.img) return;
                s.isDraggingImg = true;
                startX = e.clientX;
                startY = e.clientY;
            };

            window.addEventListener('mousemove', e => {
                if (!s.isDraggingImg) return;
                const rect = canvas.getBoundingClientRect();
                const ratioX = canvas.width / rect.width;
                const ratioY = canvas.height / rect.height;

                s.imgX += (e.clientX - startX) * ratioX;
                s.imgY += (e.clientY - startY) * ratioY;
                
                startX = e.clientX;
                startY = e.clientY;
                draw(id);
            });

            window.addEventListener('mouseup', () => {
                s.isDraggingImg = false;
            });
        }

        function draw(id) {
            const s = scenes[id];
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;  
            const h = canvas.height; 

            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, w, h);

            if (s.img) {
                ctx.save();
                ctx.translate(w / 2 + s.imgX, h / 2 + s.imgY);
                ctx.rotate(s.rotate * Math.PI / 180);
                const ratio = Math.max(w / s.img.width, h / s.img.height);
                ctx.scale(ratio * s.scale, ratio * s.scale);
                ctx.drawImage(s.img, -s.img.width / 2, -s.img.height / 2);
                ctx.restore();
            }

            const lh = h * 0.12;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, w, lh);
            ctx.fillRect(0, h - lh, w, lh);

            // 1. 축소된 ARCH 로고 및 상단 영화 제목 결합 드로잉
            if(s.showLogo) {
                ctx.save();
                // 보스 지시 사항: 크기 축소 단행 (기존 180x65 -> 125x40)
                const logoW = 125;
                const logoH = 40;
                const logoX = w - logoW - 50; 
                const logoY = 65;             // 하단으로 살짝 밀어 영화제목 공간 확보
                
                // 영화 제목이 입력되어 있을 경우 로고 바로 위에 렌더링
                if (s.movieTitle.trim() !== "") {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = 'bold 18px "Pretendard", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(s.movieTitle, logoX + (logoW / 2), logoY - 8);
                }

                // 글로벌 색상휠과 연동된 로고 박스
                ctx.fillStyle = globalAccentColor;
                ctx.beginPath();
                ctx.roundRect(logoX, logoY, logoW, logoH, 4);
                ctx.fill();

                // ARCH 텍스트 내부 삽입
                ctx.fillStyle = "#000000";
                ctx.font = '900 30px "Arial Black", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('ARCH', logoX + (logoW / 2), logoY + (logoH / 2) + 2); 
                ctx.restore();
            }

            // 2. 자막 렌더링
            if (s.text) {
                ctx.save();
                let fontFace = "'Pretendard', sans-serif";
                if(s.fontFamily === 'chosun') fontFace = "'JoseonGulim', sans-serif"; // 내장된 조선굴림체 연결
                if(s.fontFamily === 'gulim') fontFace = "'Gulim', 굴림, sans-serif";

                const fontStyle = `${s.isItalic ? 'italic ' : ''}${s.isBold ? 'bold ' : ''}${s.fontSize}px ${fontFace}`;
                ctx.font = fontStyle;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.letterSpacing = "-2px";

                const lines = s.text.split('\n');
                const lineH = s.fontSize * 1.3;
                
                const centerX = w / 2;
                const startY = h - (h * 0.08) - s.textY - ((lines.length - 1) * lineH);

                lines.forEach((line, i) => {
                    const py = startY + (i * lineH);
                    
                    if(s.isOutline) {
                        ctx.strokeStyle = "#000";
                        ctx.lineWidth = s.fontSize * 0.15;
                        ctx.lineJoin = "round";
                        ctx.strokeText(line, centerX, py);
                    }
                    
                    ctx.fillStyle = s.textColor;
                    ctx.fillText(line, centerX, py);
                });
                ctx.restore();
            }
        }

        function deleteScene(id) {
            delete scenes[id];
            const el = document.getElementById(`card-${id}`);
            if(el) el.remove();
        }

        function exportImages() {
            const activeIds = Object.keys(scenes).sort((a,b) => a - b);
            if (activeIds.length === 0) return;

            const master = document.createElement('canvas');
            master.width = 1920;
            master.height = 1080 * activeIds.length;
            const mctx = master.getContext('2d');

            activeIds.forEach((id, i) => {
                const sceneCanvas = document.getElementById(`canvas-${id}`);
                mctx.drawImage(sceneCanvas, 0, i * 1080);
            });

            const link = document.createElement('a');
            link.download = 'ARCH_CINEMA_RENDER_HQ.png';
            link.href = master.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
